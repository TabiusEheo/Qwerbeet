# Automatischer Test: bei jedem Push wird das Spiel im Browser durchgespielt (Duell-Spiele, Spieltisch, Raum-Formate, online).
# Rotes X bei GitHub = etwas ist kaputt. Läuft auf GitHub-Rechnern, kostet nichts.
name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pakete
        working-directory: tests
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Spiel durchtesten
        working-directory: tests
        run: node run.js
