<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duell der Disziplinen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07050f; --panel:#130d24; --panel2:#1d1436; --ink:#ebe8ff; --muted:#9a95c4;
  --p1:#ff2a6d; --p2:#05d9e8; --acc:#f9f002; --go:#2bff88; --grid:rgba(5,217,232,.22);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07050f;--panel:#130d24;--ink:#ebe8ff}}
:root[data-theme="dark"]{--bg:#07050f;--panel:#130d24;--ink:#ebe8ff}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;display:flex;flex-direction:column;color:var(--ink);
  font-family:'Chakra Petch',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;
  background:
    radial-gradient(900px 500px at -10% -10%,rgba(255,42,109,.12),transparent 60%),
    radial-gradient(900px 500px at 110% 0%,rgba(5,217,232,.10),transparent 60%),
    var(--bg);
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px)}
h1,h2{margin:0;font-weight:700;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.cut{clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}

/* ---------- HUD / Arena ---------- */
header.hud{border-bottom:1px solid var(--grid);background:linear-gradient(180deg,rgba(12,8,24,.95),rgba(12,8,24,.4))}
.hudrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 12px 0}
.tag{display:flex;align-items:center;gap:8px;min-width:0;font-weight:700;font-size:17px}
.tag.b{justify-content:flex-end}
.tag .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.a .nm{color:var(--p1);text-shadow:0 0 12px rgba(255,42,109,.7)}
.tag.b .nm{color:var(--p2);text-shadow:0 0 12px rgba(5,217,232,.7)}
.sc{font-size:28px;font-variant-numeric:tabular-nums;display:none}
body.match .sc{display:inline}
.mid{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.ic{border:0;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--grid);min-width:32px;height:32px;padding:0 8px;display:grid;place-items:center;font-size:14px}
.ic.warn{background:var(--p1);color:#fff;font-weight:700}
body:not(.match):not(.single) #quit{visibility:hidden}
/* ---------- Aufstieg: Türme, Stadt, Kletterer ---------- */
:root{--tw:0px}
.arena{position:relative;height:172px;overflow:hidden;border-bottom:1px solid var(--grid);background:#07050f;--cw:32px;--ch:48px}
@media (max-height:720px){.arena{height:140px}}
.tw{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;background:linear-gradient(#06030d,#150a2a 55%,#34103c 85%,#4a1446)}
.tw.a{left:0;color:var(--p1);border-right:1px solid var(--grid)} .tw.b{right:0;color:var(--p2)}
.twbg{position:absolute;left:0;right:0;bottom:0;height:100%}
.twbg svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.spire{position:absolute;top:8%;bottom:56%;width:3px;z-index:1;background:linear-gradient(#3a2960,#1e1336)}
.tw.a .spire{left:calc(6% + 25% - 1px)} .tw.b .spire{right:calc(6% + 25% - 1px)}
.spire i{position:absolute;left:50%;top:-3px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#ff2a6d;box-shadow:0 0 10px #ff2a6d;animation:blink 1.4s steps(1) infinite}
.bldg{position:absolute;bottom:0;top:44%;width:50%;z-index:1;
  background:linear-gradient(90deg,rgba(255,255,255,.06),transparent 22%,transparent 78%,rgba(0,0,0,.5)),repeating-linear-gradient(0deg,transparent 0 44px,rgba(5,217,232,.16) 44px 46px),var(--win,none) 0 0/78px 66px repeat,#130b25;
  box-shadow:inset 0 0 0 1px rgba(5,217,232,.28),0 0 28px rgba(0,0,0,.7)}
.tw.a .bldg{left:6%} .tw.b .bldg{right:6%}
.bldg::before{content:"";position:absolute;left:-5%;right:-5%;top:-5px;height:5px;background:#21163a;box-shadow:0 -1px 0 currentColor}
.bldg::after{content:"";position:absolute;top:0;bottom:0;width:2px;background:currentColor;box-shadow:0 0 10px currentColor}
.tw.a .bldg::after{right:0} .tw.b .bldg::after{left:0}
.bname{display:none}
.cl{position:absolute;left:0;bottom:0;width:var(--cw);height:var(--ch);z-index:3;transform-origin:50% 60%}
.cl svg,.vcl svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 4px currentColor)}
.cl .p-climb,.cl .flame,.vcl .p-climb,.vcl .flame{display:none}
.cl.climb .p-climb,.vcl.climb .p-climb{display:inline}
.cl.climb .p-stand,.vcl.climb .p-stand{display:none}
.cl.boost .flame{display:inline}
.cl .cloak,.vcl .cloak{animation:sway 2.8s ease-in-out infinite}
.cl .body,.vcl .body{animation:breathe 2.4s ease-in-out infinite}
.tw.b .cloak,.tw.b .body{animation-delay:-1.3s}
.flame path{animation:flame .12s steps(2) infinite}
@keyframes flame{50%{transform:scaleY(.6)}}
.hm{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:2px;font-size:10px;font-weight:700;white-space:nowrap;text-shadow:0 0 6px currentColor}
.rope{position:absolute;width:2px;margin-left:-1px;background:currentColor;box-shadow:0 0 8px currentColor;transform-origin:50% 100%;z-index:2;pointer-events:none}
.twshout{position:absolute;left:0;right:0;top:6px;z-index:5;padding:0 4px;text-align:center;font-weight:700;font-size:clamp(12px,3.4vw,18px);line-height:1.2;opacity:0;pointer-events:none;text-shadow:0 0 12px currentColor}
.twshout.on{animation:shout 2.4s ease-out}
@keyframes shout{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.1)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
@keyframes breathe{50%{transform:translateY(-1.2px) scaleY(1.012)}}
@keyframes sway{50%{transform:skewX(7deg) rotate(4deg)}}
@keyframes blink{50%{opacity:.12}}
.citysvg text{font-family:'Chakra Petch',sans-serif}
.citysvg .car.r{animation:flyR linear infinite}
.citysvg .car.l{animation:flyL linear infinite}
@keyframes flyR{from{transform:translateX(-60px)}to{transform:translateX(1980px)}}
@keyframes flyL{from{transform:translateX(1980px)}to{transform:translateX(-60px)}}
.citysvg .rain{animation:rain .9s linear infinite}
@keyframes rain{to{transform:translate(-24px,88px)}}
.citysvg .beam{animation:beam 9s ease-in-out infinite alternate}
.citysvg .beam.b2{animation-duration:12s;animation-delay:-5s}
@keyframes beam{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.citysvg .blink{animation:blink 1.6s steps(1) infinite}
.citysvg .flick{animation:flick 4.5s steps(1) infinite}
@keyframes flick{0%,100%{opacity:1}44%{opacity:.2}46%{opacity:1}49%{opacity:.35}52%{opacity:1}}
.citysvg .holo{animation:holo 6s steps(1) infinite}
@keyframes holo{0%,100%{opacity:.75}61%{opacity:.3}63%{opacity:.75}66%{opacity:.45}68%{opacity:.75}}
@media (min-width:1000px) and (min-height:640px){
  :root{--tw:clamp(170px,15vw,250px)}
  header.hud{position:sticky;top:0;z-index:6}
  .arena{position:fixed;top:var(--hudH,56px);left:0;right:0;bottom:0;height:auto;border:0;background:none;pointer-events:none;z-index:1;overflow:visible;--cw:58px;--ch:87px}
  .tw{width:var(--tw)}
  .tw.a{border-right:1px solid var(--grid)} .tw.b{border-left:1px solid var(--grid)}
  .twbg{height:230px;-webkit-mask-image:linear-gradient(transparent,#000 40%);mask-image:linear-gradient(transparent,#000 40%)}
  .bldg{top:24%;width:52%}
  .spire{top:5%;bottom:76%}
  .tw.a .spire{left:calc(6% + 26% - 1px)} .tw.b .spire{right:calc(6% + 26% - 1px)}
  .bname{display:block;position:absolute;top:26px;writing-mode:vertical-rl;text-orientation:upright;font-weight:700;font-size:14px;letter-spacing:3px;text-shadow:0 0 8px currentColor;max-height:calc(100% - 52px);overflow:hidden}
  .tw.a .bname{left:14%} .tw.b .bname{right:14%}
  .hm{font-size:12px}
  .twshout{top:14px;font-size:17px}
  main{padding-left:calc(var(--tw) + 16px);padding-right:calc(var(--tw) + 16px)}
  .padbar{left:var(--tw);right:var(--tw)}
}

/* ---------- Einheitliche Spiel-Leiste, Länge, Spielwahl, neue Spiele ---------- */
main{flex-direction:column}
.gbar{width:100%;max-width:660px;display:grid;grid-template-columns:1fr auto auto auto 1fr;gap:10px;align-items:center;margin-bottom:12px;font-weight:700;font-size:14px}
.gbar .gname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gbar .gname.c2{text-align:right}
.pips{font-size:18px;letter-spacing:3px;white-space:nowrap}
.gfmt{color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap}
.seg{display:flex;box-shadow:inset 0 0 0 1px var(--grid)}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:700;font-size:15px;min-width:76px}
.seg button + button{box-shadow:inset 1px 0 0 var(--grid)}
.seg button.on{background:var(--p2);color:#07050f}
.seg button small{display:block;font-size:11px;font-weight:500;opacity:.8}
body.bot #pad1{opacity:.3;pointer-events:none}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.choice{border:0;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--grid);padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.choice:hover{box-shadow:inset 0 0 0 1px var(--p2),0 0 18px rgba(5,217,232,.25)}
.choice .ti{font-size:34px}
.choice small{color:var(--muted)}
.choice em{font-style:normal;font-size:12px;color:var(--acc)}
.track{position:relative;width:100%;height:46px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--grid);overflow:hidden}
.hitline{position:absolute;left:12%;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.note{position:absolute;top:50%;left:100%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--p2);box-shadow:0 0 10px var(--p2)}
.note.gold{background:var(--acc);box-shadow:0 0 12px var(--acc)}
.note.gone{opacity:0 !important;transition:opacity .25s}
.tugnames b{font-weight:500;color:var(--ink);font-size:13px}
.chain{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:14px}
.ccard{min-height:92px;padding:14px 10px;display:flex;flex-direction:column;justify-content:center;gap:6px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--grid)}
.ccard.new{box-shadow:inset 0 0 0 2px var(--p2)}
.ccard b{font-size:16px;line-height:1.25}
.ccard em{font-style:normal;font-weight:700;font-size:19px;color:var(--acc)}
.cvs{font-size:22px;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px;margin-top:14px}
.mcard{aspect-ratio:3/4;border:0;background:linear-gradient(160deg,#261b44,#140c26);box-shadow:inset 0 0 0 1px var(--grid);font-size:28px;display:grid;place-items:center;padding:0}
.mcard span{opacity:0;transition:opacity .15s}
.mcard.up span,.mcard.done span{opacity:1}
.mcard.up{background:#2c2150;box-shadow:inset 0 0 0 2px var(--acc)}
.mcard.done.m0{background:rgba(255,42,109,.16);box-shadow:inset 0 0 0 2px var(--p1)}
.mcard.done.m1{background:rgba(5,217,232,.14);box-shadow:inset 0 0 0 2px var(--p2)}
.pile{margin-top:6px}
.bombrow{position:relative;width:100%;height:92px}
.bomb{position:absolute;top:0;left:50%;font-size:clamp(52px,14vw,80px);line-height:1;transform:translateX(-50%);transition:left .35s ease,transform .1s}
.bomb.pulse{transform:translateX(-50%) scale(1.12)}
.bomb.boom{transform:translateX(-50%) scale(1.6)}
.bbar{position:relative;width:100%;height:22px;background:rgba(255,255,255,.08)}
.bzone{position:absolute;top:0;bottom:0;background:var(--go);box-shadow:0 0 12px var(--go)}
.bptr{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 8px #fff}
.bptr.fast{background:var(--acc);box-shadow:0 0 12px var(--acc)}

/* ---------- Powerups, Blitzrunde, Toast ---------- */
.hands.two{grid-template-columns:1fr 1fr}
.hands.five{grid-template-columns:repeat(5,1fr)}
.hands.two .hand{font-size:16px;font-weight:700}
.pures{margin-top:14px;text-align:left}
.pures p{margin:6px 0;font-size:14px;line-height:1.45}
.pures.big p{font-size:17px}
.toast{position:fixed;left:50%;top:calc(var(--hudH,56px) + 12px);transform:translateX(-50%);z-index:70;width:max-content;max-width:90vw;padding:10px 16px;text-align:center;font-weight:700;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--acc),0 0 24px rgba(0,0,0,.6);opacity:0;pointer-events:none}
.toast.on{animation:toast 2.8s ease-out}
@media (max-width:999px),(max-height:639px){.toast{top:calc(var(--hudH,56px) + 184px)}}
@media (max-width:999px) and (max-height:720px),(max-height:639px){.toast{top:calc(var(--hudH,56px) + 152px)}}
@keyframes toast{0%{opacity:0;transform:translateX(-50%) translateY(-8px)}10%{opacity:1;transform:translateX(-50%)}85%{opacity:1}100%{opacity:0}}

.optlist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.oli{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 12px;text-align:left;font-weight:500;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--grid)}
.oli span{flex:none;width:26px;height:26px;display:grid;place-items:center;background:var(--p2);color:#07050f;font-weight:700}
.oli.right{background:var(--go);color:#07050f}
.hands.four{grid-template-columns:repeat(4,1fr)}
.hand.duo{font-weight:700;font-size:18px}
.hand.duo.right{box-shadow:inset 0 0 0 2px var(--go)}
@media (max-width:480px){.optlist{grid-template-columns:1fr}}
/* ---------- Intro: Regel, Steuerung, Knöpfe ---------- */
.card p.rule{font-size:17px;margin:10px auto 4px}
.ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:480px;margin:14px auto 2px}
.ctl > div{padding:8px 8px 9px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 6px;line-height:1.3}
.ctl .l{box-shadow:inset 0 0 0 1px rgba(255,42,109,.7)} .ctl .r{box-shadow:inset 0 0 0 1px rgba(5,217,232,.7)}
.ctl .w{grid-column:1 / -1;box-shadow:inset 0 0 0 1px var(--grid)}
.ctl small{flex-basis:100%;font-size:12px;font-weight:700}
.ctl .kl{display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:3px;font-size:14px}
kbd{display:inline-grid;place-items:center;min-width:25px;height:25px;padding:0 5px;font:inherit;font-weight:700;font-size:13px;color:var(--ink);background:#0d0919;box-shadow:inset 0 -2px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(235,232,255,.35)}
.ctl .l kbd,.pb.a kbd{color:var(--p1)} .ctl .r kbd,.pb.b kbd{color:var(--p2)}
.ctlnote{color:var(--muted);font-size:13px;margin:6px auto 0;max-width:54ch;line-height:1.4}
.introbtns{display:flex;justify-content:center;align-items:flex-end;gap:12px;flex-wrap:wrap}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:default}
.puhint{color:var(--acc)}
.more{color:var(--muted);font-size:14px;line-height:1.5}

/* ---------- Powerups an den Figuren ---------- */
.pb{position:absolute;bottom:5px;z-index:4;display:none;width:calc(50% - 6px);pointer-events:auto;font-size:11px;line-height:1.25;color:var(--ink);text-align:left}
body.match .pb{display:block}
.tw.a .pb{left:calc(6% + 3px)} .tw.b .pb{right:calc(6% + 3px)}
.pbbox{padding:4px 5px;background:rgba(9,5,20,.84);box-shadow:inset 0 0 0 1px currentColor}
.pbh,.pbn,.pbc{display:none}
.pba{font-size:10px;font-weight:700;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pba .lf{display:none}
.pbi{display:flex;flex-wrap:wrap;gap:1px 3px;font-size:16px;line-height:1.2;min-height:19px}
.pbi em{font-style:normal;font-size:11px;color:var(--muted);align-self:center}
.pb .pbc.m{display:inline;font-size:16px}
.pbok{font-weight:700;color:var(--acc);font-size:13px;padding:2px 0}
.pbl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.pbb{border:0;padding:4px 1px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(235,232,255,.25);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;font-weight:700;line-height:1.1}
.pbb span{font-size:20px}
.pbb kbd{display:none}
.pbb .nm{display:none}
.pbb .sn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px}
.pbb:disabled{opacity:.28;cursor:default}
.pbt{font-weight:700;font-size:12px;margin-bottom:4px;color:currentColor;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw .pb.sel{top:4px;bottom:4px;left:4px;right:4px;width:auto}
.pb.sel .pbbox{height:100%;overflow:auto;background:rgba(9,5,20,.93)}
.pbr{font-weight:700;font-size:13px;line-height:1.25}
.pbr b{display:block;font-size:24px}
.pb.rev .pbbox{box-shadow:inset 0 0 0 2px currentColor,0 0 22px currentColor;animation:pbpop .5s ease-out}
@keyframes pbpop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:none}}
.twgift{position:absolute;left:0;right:0;top:30%;z-index:6;padding:0 4px;text-align:center;font-weight:700;font-size:clamp(13px,3.4vw,19px);line-height:1.2;opacity:0;pointer-events:none;text-shadow:0 0 12px currentColor}
.twgift b{display:block;font-size:clamp(28px,8vw,46px)}
.twgift.on{animation:gift 3.4s ease-out}
@keyframes gift{0%{opacity:0;transform:scale(.4)}10%{opacity:1;transform:scale(1.15)}20%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.reward{margin:14px auto 0;max-width:54ch;padding:8px 14px;text-align:left;background:rgba(249,240,2,.07);box-shadow:inset 0 0 0 1px var(--acc)}
.reward p{margin:5px 0;line-height:1.45}
.reward .kick{margin-bottom:2px}
.mcard.done.mz{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 2px var(--muted)}
.zcn{color:var(--acc)}
.pile.act .nums{box-shadow:0 0 0 1px var(--acc);padding:6px 0}
.num small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
@media (min-width:1000px) and (min-height:640px){
  .pb{width:calc(52% - 6px);bottom:8px;font-size:12px}
  .pbbox{padding:6px 7px}
  .pbh,.pbn,.pba{display:block} .pb .pbc{display:block;font-weight:700;color:var(--acc);margin-top:3px} .pb .pbc.m{display:none}
  .pbh{font-weight:700;font-size:12px;margin-bottom:3px;color:currentColor}
  .pbn{color:var(--muted);margin-top:4px;font-size:11px}
  .pba{margin-top:4px;font-size:12px;white-space:normal}
  .pba .lf{display:inline} .pba .sf{display:none}
  .pbi{font-size:19px}
  .tw .pb.sel{top:auto;left:auto;right:auto;bottom:8px;width:calc(52% - 6px)}
  .tw.a .pb.sel{left:calc(6% + 3px)} .tw.b .pb.sel{right:calc(6% + 3px)}
  .pb.sel .pbbox{height:auto}
  .pbl{grid-template-columns:1fr}
  .pbtn{display:none}
  .pbb{flex-direction:row;flex-wrap:wrap;justify-content:flex-start;gap:2px 6px;padding:5px 6px;text-align:left}
  .pbt{white-space:normal}
  .pbb span{font-size:18px;order:1}
  .pbb kbd{display:inline-grid;min-width:21px;height:21px;font-size:12px;margin-left:auto;order:2}
  .pbb .nm{display:block;order:3;flex-basis:100%;font-size:11px;white-space:normal}
  .pbb .sn{display:none}
  .pbr{font-size:14px} .pbr b{font-size:40px}
  .twgift{top:36%}
}

/* ---------- Hilfe (?-Knopf) ---------- */
.help{position:fixed;inset:0;z-index:80;overflow:auto;padding:calc(var(--hudH,56px) + 10px) 12px 24px;background:rgba(5,3,11,.78)}
.help .card{margin:0 auto;text-align:left}
.help h2{font-size:22px;margin:4px 0 6px}
.help h3{margin:18px 0 6px;font-size:16px;color:var(--acc)}
.help p,.help li{line-height:1.5;margin:6px 0}
.help ul{padding-left:20px;margin:6px 0}
.help .ctl{margin-left:0}
.help .card p{max-width:none;margin-left:0;margin-right:0}
.help .hclose{display:block;margin:18px auto 0}
.help .hrun{color:var(--acc);font-weight:700}
#help{font-weight:700}
.mid .ms{display:none}
@media (max-width:480px){.mid .ml{display:none} .mid .ms{display:inline}}
#help.on{background:var(--acc);color:#07050f}
.mrules{max-width:54ch;margin:10px auto 0;padding-left:20px;text-align:left;color:var(--muted);font-size:14px;line-height:1.45}
.mrules li{margin:3px 0}

/* ---------- Gesamtstatistik ---------- */
.hist{margin-top:18px;text-align:left}
.hrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--grid)}
.hrow .hs{font-variant-numeric:tabular-nums;color:var(--muted)}
.hrow .hw{font-weight:700;text-align:right}
.jkb{display:inline-block;background:var(--acc);color:#07050f;font-size:11px;padding:0 4px;margin-left:4px}

/* ---------- Sieg-Animation (Vollbild) ---------- */
.vic{position:fixed;inset:0;z-index:90;overflow:hidden;background:#05030b;opacity:0;transition:opacity .45s;cursor:pointer}
.vic.on{opacity:1}
.vcam{position:absolute;left:0;right:0;top:0;height:300vh}
.vsky{position:absolute;inset:0;background:linear-gradient(#030208,#0d0620 35%,#2a0b33 80%,#4a1446)}
.vstars{position:absolute;left:0;top:0;width:1px;height:1px;border-radius:50%}
.vcity{position:absolute;left:0;right:0;bottom:0;height:42vh}
.vcity svg{display:block;width:100%;height:100%}
.vtower{position:absolute;left:50%;bottom:0;width:min(260px,36vw);height:225vh;transform:translateX(-50%);
  background:linear-gradient(90deg,rgba(255,255,255,.07),transparent 22%,transparent 78%,rgba(0,0,0,.55)),repeating-linear-gradient(0deg,transparent 0 58px,rgba(5,217,232,.18) 58px 60px),var(--win,none) 0 0/78px 66px repeat,#130b25;
  box-shadow:inset 0 0 0 1px rgba(5,217,232,.3),0 0 60px rgba(0,0,0,.8)}
.vtower::before{content:"";position:absolute;left:-6%;right:-6%;top:-8px;height:8px;background:#21163a;box-shadow:0 -2px 0 currentColor,0 0 18px currentColor}
.vtower::after{content:"";position:absolute;top:0;bottom:0;left:0;width:3px;background:currentColor;box-shadow:0 0 14px currentColor}
.vspire{position:absolute;left:50%;bottom:100%;width:6px;height:18vh;margin-left:-3px;background:linear-gradient(#3a2960,#1e1336)}
.vspire i{position:absolute;left:50%;top:-6px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:currentColor;box-shadow:0 0 22px currentColor;animation:blink 1s steps(1) infinite}
.vsign{position:absolute;top:8vh;right:12%;writing-mode:vertical-rl;text-orientation:upright;font-weight:700;font-size:clamp(16px,2.6vh,26px);letter-spacing:4px;text-shadow:0 0 12px currentColor}
.vcl{position:absolute;left:0;bottom:0;height:min(16vh,150px);width:calc(min(16vh,150px) * 2 / 3);transform-origin:50% 60%;z-index:3}
.vbeam{position:absolute;bottom:-10vh;width:22vw;height:130vh;background:linear-gradient(to top,rgba(191,233,255,.16),transparent 85%);clip-path:polygon(46% 100%,54% 100%,100% 0,0 0);transform-origin:50% 100%;transition:transform 1.4s cubic-bezier(.3,.8,.3,1)}
.vbeam.v1{left:4vw;transform:rotate(-38deg)} .vbeam.v2{right:4vw;transform:rotate(38deg)}
.vic.end .vbeam.v1{transform:rotate(14deg)} .vic.end .vbeam.v2{transform:rotate(-14deg)}
.vflash{position:absolute;inset:0;background:currentColor;opacity:0;pointer-events:none}
.vic.end .vflash{animation:vflash .7s ease-out}
@keyframes vflash{0%{opacity:.55}100%{opacity:0}}
.vfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.vtitle{position:absolute;left:0;right:0;top:5vh;padding:0 12px;text-align:center;opacity:0;transform:scale(.7);transition:opacity .5s,transform .6s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
.vic.end .vtitle{opacity:1;transform:none}
.vname{font-size:clamp(38px,9vw,104px);font-weight:700;line-height:1;overflow-wrap:anywhere;text-shadow:3px 0 var(--p1),-3px 0 var(--p2),0 0 30px currentColor;animation:glitch 3s infinite steps(1)}
.vsub{font-size:clamp(16px,3.4vw,26px);font-weight:500;color:var(--ink);margin-top:10px}
.vscore{font-size:clamp(22px,5vw,40px);font-weight:700;color:var(--acc);margin-top:6px}
.vbtns{position:absolute;left:0;right:0;bottom:calc(5vh + env(safe-area-inset-bottom,0px));text-align:center;opacity:0;transition:opacity .5s;pointer-events:none}
.vic.ready .vbtns{opacity:1;pointer-events:auto}

/* ---------- Layout ---------- */
main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 14px}
body.pads main{padding-bottom:calc(22vh + 24px)}
.card{width:100%;max-width:660px;padding:26px 22px;text-align:center;
  background:linear-gradient(160deg,var(--panel2),var(--panel));
  box-shadow:inset 0 0 0 1px rgba(5,217,232,.45),inset 0 0 50px rgba(5,217,232,.07)}
.card p{line-height:1.5;max-width:54ch;margin:12px auto}
.kick{color:var(--acc);font-weight:500;font-size:14px;letter-spacing:.04em}
.hint{color:var(--muted);font-size:14px;margin-top:10px;line-height:1.45}
.btn{background:var(--acc);color:#07050f;border:0;padding:14px 28px;font-weight:700;font-size:17px;margin-top:16px;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--grid)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;margin-top:12px;font-size:14px}
.c1{color:var(--p1)} .c2{color:var(--p2)}

/* Menü */
.title{font-size:clamp(30px,8.5vw,58px);letter-spacing:.01em;text-shadow:2px 0 var(--p1),-2px 0 var(--p2)}
@keyframes glitch{0%,90%,100%{text-shadow:2px 0 var(--p1),-2px 0 var(--p2);transform:none}92%{text-shadow:-4px 0 var(--p1),4px 0 var(--p2);transform:translateX(2px)}95%{text-shadow:5px 1px var(--p1),-3px -1px var(--p2);transform:translateX(-2px) skewX(-4deg)}}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:22px 0 4px}
.vs input{width:100%;min-width:0;border:0;background:rgba(255,255,255,.04);padding:12px;font:inherit;font-weight:700;font-size:17px;text-align:center;color:var(--ink)}
#n0in{box-shadow:inset 0 -2px 0 var(--p1)} #n1in{box-shadow:inset 0 -2px 0 var(--p2)}
.vs .x{color:var(--acc);font-weight:700}
.row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:16px;font-weight:500}
.stepper{display:flex}
.stepper button{width:42px;height:42px;border:0;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--grid);font-size:20px;font-weight:700}
.stepper input{width:66px;height:42px;border:0;background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px var(--grid);text-align:center;font:inherit;font-size:19px;font-weight:700;color:var(--ink);-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cat{font-size:15px;color:var(--muted);text-align:left;margin:24px 0 10px;font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{position:relative;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px var(--grid);transition:opacity .15s}
.tile.off{opacity:.42}
.tplay{width:100%;height:100%;border:0;background:none;padding:14px 38px 14px 12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.tplay:hover{background:rgba(5,217,232,.08)}
.tplay .ti{font-size:24px}
.tplay small{color:var(--muted);font-size:13px;line-height:1.35}
.ttog{position:absolute;top:8px;right:8px;width:26px;height:26px;border:0;padding:0;font-size:14px;font-weight:700;background:var(--p2);color:#07050f}
.tile.off .ttog{background:transparent;box-shadow:inset 0 0 0 1px var(--muted);color:var(--muted)}

/* Intro / Ergebnis */
.icon{font-size:52px;margin:8px 0}
.big-h{font-size:clamp(26px,7.5vw,44px)}
.hl{margin-top:20px;text-align:left}
.hlr{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--grid)}
.hlr span{color:var(--muted)}

/* Bühne: Reaktion, Hämmern, Tauziehen, Zeitgefühl, Farbfalle */
.stage{width:100%;max-width:660px;min-height:min(46vh,340px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;
  background:#150a1a;box-shadow:inset 0 0 0 2px var(--p1),inset 0 0 60px rgba(255,42,109,.15);transition:background .06s}
.stage.neutral{background:#0d0919;box-shadow:inset 0 0 0 1px var(--grid),inset 0 0 60px rgba(5,217,232,.08)}
.stage.go{background:var(--go);color:#07050f;box-shadow:0 0 60px rgba(43,255,136,.5)}
.stage.fake{background:var(--acc);color:#07050f}
.stage.bad{background:var(--p1);color:#fff}
.stage .big{font-size:clamp(40px,12vw,84px);font-weight:700;line-height:1}
.stage .sub{font-weight:500;line-height:1.45}
.tapbars,.marks{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.tapbars div,.marks div{padding:10px;font-weight:700}
.tapbars div:first-child,.marks div:first-child{box-shadow:inset 0 0 0 2px var(--p1);color:var(--p1)}
.tapbars div:last-child,.marks div:last-child{box-shadow:inset 0 0 0 2px var(--p2);color:var(--p2)}
.tapbars b{display:block;font-size:44px;color:var(--ink)}
.marks b{display:block;font-size:17px;color:var(--ink);margin-top:4px}
.timer{width:100%;height:8px;background:rgba(255,255,255,.1)}
.timer i{display:block;height:100%;width:100%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.rope{position:relative;width:100%;height:14px;margin:26px 0 6px;background:linear-gradient(90deg,var(--p1) 0 4%,rgba(255,42,109,.25) 4% 50%,rgba(5,217,232,.25) 50% 96%,var(--p2) 96%)}
.rope::after{content:"";position:absolute;left:50%;top:-10px;bottom:-10px;width:2px;background:var(--muted)}
.knot{position:absolute;top:50%;width:24px;height:46px;margin:-23px 0 0 -12px;background:var(--acc);box-shadow:0 0 18px var(--acc);transition:left .07s linear}
.tugnames{display:flex;justify-content:space-between;width:100%;font-weight:700}
.clock{font-size:clamp(50px,15vw,96px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.stroop{font-size:clamp(52px,16vw,110px);font-weight:700;line-height:1.1;min-height:1.2em;transition:transform .1s}

/* Quiz */
.q{font-size:clamp(20px,5vw,28px);margin-top:10px;line-height:1.25}
.emo{font-size:clamp(44px,12vw,72px);letter-spacing:.06em;line-height:1.25}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--grid);padding:12px;font-weight:500;min-height:58px}
.opt span{flex:none;width:28px;height:28px;display:grid;place-items:center;background:var(--p2);color:#07050f;font-weight:700}
.opt em{margin-left:auto;padding-left:8px;font-style:normal;font-weight:700;color:var(--acc);white-space:nowrap}
.opts.two .opt{min-height:84px;font-size:17px}
.opt:disabled{opacity:.45;cursor:default}
.opt.right{background:var(--go);color:#07050f;opacity:1}
.opt.right em{color:#07050f}
.opt.wrong{background:var(--p1);color:#fff;opacity:1}
.qbar{height:6px;background:rgba(255,255,255,.08);margin-top:16px}
.qbar i{display:block;height:100%;width:100%;background:var(--acc)}
.status{margin-top:14px;font-weight:500;min-height:1.4em;line-height:1.5}
.ex{color:var(--muted);font-weight:400}
.task{font-size:clamp(40px,12vw,76px);font-weight:700;margin:14px 0;text-shadow:0 0 18px rgba(5,217,232,.5)}
.ansin{width:min(260px,100%);border:0;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 2px var(--p2);padding:12px;font:inherit;font-size:28px;font-weight:700;text-align:center;color:var(--ink);margin-top:14px}
.ansin.wide{width:min(380px,100%);font-size:24px;text-transform:uppercase}
.dotbox{position:relative;height:190px;margin-top:14px;background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px var(--grid);display:grid;place-items:center;overflow:hidden}
.dot{position:absolute;width:14px;height:14px;border-radius:50%}
.dmsg{color:var(--muted);font-weight:500}
.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:18px 0 6px}
.letters span{width:clamp(28px,8vw,44px);height:clamp(36px,10vw,54px);display:grid;place-items:center;font-size:clamp(19px,5.5vw,28px);font-weight:700;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--p2)}

/* Hölzer / Bluff / Schätzen */
.sticks{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:20px 0 8px;min-height:70px}
.sticks i{width:8px;height:64px;background:var(--p2);box-shadow:0 0 10px var(--p2)}
.nums{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.num{width:64px;height:64px;border:0;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 2px var(--p2);font-size:26px;font-weight:700}
.num:hover:not(:disabled){background:var(--p2);color:#07050f}
.num:disabled{opacity:.25;cursor:default}
.who{margin-top:14px;font-size:clamp(22px,6vw,32px)}
.reveal{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.reveal div{padding:14px;font-weight:700}
.reveal div:first-child{box-shadow:inset 0 0 0 2px var(--p1);color:var(--p1)}
.reveal div:last-child{box-shadow:inset 0 0 0 2px var(--p2);color:var(--p2)}
.reveal b{display:block;font-size:clamp(24px,7vw,44px);color:var(--ink);word-break:break-word}
.answer{font-size:clamp(26px,7vw,40px);font-weight:700;color:var(--acc);margin-top:8px}

/* Senso */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px auto 0;max-width:340px}
.sbt{aspect-ratio:1;border:0;background:var(--c);color:#07050f;font-size:22px;font-weight:700;opacity:.3;transition:opacity .08s,transform .08s;touch-action:manipulation}
.sbt.lit{opacity:1;transform:scale(1.04);box-shadow:0 0 34px var(--c)}

/* Schnick Schnack Schnuck */
.call{font-size:clamp(34px,10vw,58px);font-weight:700;min-height:1.2em;margin-top:8px}
.sspgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.side{padding:10px 8px}
.side.a{box-shadow:inset 0 0 0 2px var(--p1)} .side.b{box-shadow:inset 0 0 0 2px var(--p2)}
.hands{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
.hand{border:0;height:58px;background:rgba(255,255,255,.05);font-size:clamp(20px,6vw,28px);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:manipulation;padding:0}
.hand small{font-size:11px;color:var(--muted)}
.hand:disabled{opacity:.3}
.pick{font-size:44px;min-height:54px;margin-top:6px}

/* Neon-Sprint */
.sprint{width:100%;max-width:660px}
.sprint canvas{display:block;width:100%;height:280px;background:#0b0716;box-shadow:inset 0 0 0 1px var(--grid)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-weight:700;font-size:14px}

/* Buzzer-Felder */
.padbar{position:fixed;left:0;right:0;bottom:0;height:calc(22vh + env(safe-area-inset-bottom,0px));display:none;grid-template-columns:1fr 1fr;z-index:40}
body.pads .padbar{display:grid}
.pad{border:0;font-weight:700;font-size:clamp(16px,4vw,22px);touch-action:none;user-select:none;-webkit-user-select:none;
  padding-bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.pad small{font-weight:500;opacity:.8;font-size:13px}
.pad.a{background:linear-gradient(180deg,#ff2a6d,#9c0f42);color:#fff}
.pad.b{background:linear-gradient(180deg,#05d9e8,#03707a);color:#07050f}
.pad.hit{filter:brightness(1.35)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:55}

/* ---------- Häuserleiste: eine Reihe Dächer, Namen über den Figuren ---------- */
.arena{height:auto;--cw:24px;--ch:36px;--lh:96px}
@media (max-height:720px){.arena{height:auto;--lh:88px;--cw:22px;--ch:34px}}
.strip{position:relative;height:var(--lh);overflow:hidden;background:linear-gradient(#07040f,#110922 65%,#1a0e2d)}
body.pu .strip{--pbw:58px}
.ltrack{position:absolute;left:var(--pbw,0px);right:var(--pbw,0px);top:0;bottom:0;overflow:hidden}
.lsky,.lsky svg,.lcity,.lcity svg{position:absolute;left:0;top:0;display:block}
.lworld{position:absolute;left:0;top:0;bottom:0;transition:transform .7s cubic-bezier(.3,.7,.3,1)}
.cl.a{color:var(--p1)} .cl.b{color:var(--p2)}
.clr{width:100%;height:100%;transform-origin:50% 60%}
.strip .cl svg{filter:drop-shadow(0 0 2px currentColor)}
.strip .hm{letter-spacing:.03em}
.cl.hi .hm{margin-bottom:13px}
.lmark{position:absolute;left:calc(var(--pbw,0px) + 6px);bottom:4px;z-index:5;font-size:11px;font-weight:700;display:none;text-shadow:0 0 6px currentColor}
.lmark.a{color:var(--p1)} .lmark.b{color:var(--p2);bottom:18px}
.lmark.on{display:block}
.pside{position:absolute;top:0;bottom:0;width:50%;pointer-events:none;z-index:4}
.pside.a{left:0;color:var(--p1)} .pside.b{right:0;color:var(--p2)}
.pside .twshout{top:4px;left:calc(var(--pbw,0px) + 8px);right:8px;padding:0;text-align:center;font-size:clamp(11px,3vw,15px)}
.pside.b .twshout{left:8px;right:calc(var(--pbw,0px) + 8px)}
.pside .twgift{top:auto;bottom:4px;left:calc(var(--pbw,0px) + 8px);right:8px;font-size:11px}
.pside.b .twgift{left:8px;right:calc(var(--pbw,0px) + 8px)}
.pside .twgift b{display:inline;font-size:14px;margin-right:4px}
.pside .pb{pointer-events:auto;top:4px;bottom:auto;width:calc(var(--pbw,0px) - 8px);max-width:none}
.pside.a .pb{left:4px;right:auto} .pside.b .pb{right:4px;left:auto}
.pside .pb .pbbox{max-height:calc(var(--lh) - 8px);overflow:hidden}
.pside .pb.sel{top:3px;bottom:3px;left:3px;right:3px;width:auto;z-index:6}
.pside .pb.sel .pbbox{height:100%;max-height:none}
.pside .pbt{font-size:11px;margin-bottom:3px}
.pside .pbb{padding:2px 1px}
.pside .pbb span{font-size:17px}
.pside .pbok{font-size:11px;line-height:1.15;white-space:normal}
@media (min-width:1000px) and (min-height:640px){
  :root{--tw:0px}
  .arena{position:relative;top:auto;left:auto;right:auto;bottom:auto;height:auto;border:0;border-bottom:1px solid var(--grid);background:#07050f;pointer-events:auto;z-index:1;overflow:hidden;--cw:30px;--ch:46px;--lh:106px}
  main{padding-left:14px;padding-right:14px}
  .padbar{left:0;right:0}
  body.pu .strip{--pbw:150px}
  .cl.hi .hm{margin-bottom:16px}
  .pside .pb.sel .pbl{display:flex;gap:6px}
  .pside .pb.sel .pbb{flex:1 1 0;min-width:0}
  .pside .pbok{font-size:13px}
}

// Gleichzeitig antworten: Zeit und Trefferquote je nach Spiel und Stufe
function botDuo(kind, R, n, act){
  const ms = R.ms || 10000;
  let t, acc = bv(BOTP[kind] || BOTP.quiz);
  if (kind === 'emo') { const [a, b] = bv(BOTP.tEmo); t = brnd(a, b)*ms; acc = clamp(acc - .15 + .3*t/ms, .2, .97); }
  else { const [a, b] = bv(kind === 'wf' ? BOTP.tWf : kind === 'blitz' ? BOTP.tBlitz : BOTP.tQuiz); t = brnd(a, b)*1000; }
  if (t > ms - 200) return;
  const wrong = [...Array(n).keys()].filter(x => x !== R.correct);
  later(() => act(Math.random() < acc ? R.correct : pickOne(wrong)), t);
}
// Ketten: je größer der Abstand, desto sicherer
function botChain(isT, ref, nx, act){
  const truth = nx.v > ref.v ? 1 : 0;
  const gap = isT ? Math.abs(nx.v - ref.v)/3 + 1 : Math.max(nx.v, ref.v)/Math.min(nx.v, ref.v);
  const p = clamp(bv(BOTP.chain) + .25*clamp(Math.log10(gap)/2, 0, .5), .3, .97);
  const [a, b] = bv(BOTP.tQuiz);
  later(() => act(Math.random() < p ? truth : 1 - truth), Math.min(4300, brnd(a, b)*700));
}
// Buzzern und Tippen: tippt Buchstabe für Buchstabe in sein gesperrtes Feld
function botTypeAnswer(o, task, konter, botAt, inp, check){
  const lim = konter ? o.konterMs : o.answerMs, now = performance.now();
  const typing = task.show.length*130 + 600, okP = o.bot && o.bot.ok ? bv(o.bot.ok) : .97;
  let ok = false, delay;
  if (!konter) { ok = Math.random() < okP; delay = brnd(250, 650); }
  else if (botAt <= now + lim - typing - 400) { ok = Math.random() < okP; delay = Math.max(300, botAt - now); }
  else delay = Math.random() < .5 ? lim + 500 : Math.max(300, lim - typing - 700);
  const txt = ok ? task.show : o.numeric ? String(+task.show + pickOne([-10,-2,-1,1,2,10])) : scramble(task.show);
  let k = 0;
  const step = () => { if (!inp.isConnected) return; if (k < txt.length) { inp.value = txt.slice(0, ++k); later(step, brnd(90, 160)); } else later(() => { if (inp.isConnected) check(); }, 250); };
  later(step, delay);
}
// Schätzen: Jahreszahlen mit festem Fehler, sonst prozentual, grob gerundet wie ein Mensch
function botEst(q){
  const [text, ans, unit] = q;
  let v;
  if (/in welchem jahr/i.test(text)) v = Math.round(ans + gauss()*bv(BOTP.estY));
  else {
    v = ans*Math.exp(gauss()*bv(BOTP.est));
    if (unit === '%') v = Math.min(100, v);
    v = Number(v.toPrecision(2));
    if (Number.isInteger(ans)) v = Math.max(ans > 0 ? 1 : 0, Math.round(v));
  }
  return String(v).replace('.', ',');
}
// Auktion: Budget auf die nötigen Siege verteilen, schwer rechnet auch mit dem Gegner
function botBid(money, s){
  const need = LEN.auk || 3, mine = money[1], opp = money[0];
  const myN = Math.max(1, need - s[1]), opN = Math.max(1, need - s[0]), base = mine/myN;
  let b;
  if (BOT.lvl === 0) b = mine*brnd(.1, .6);
  else if (BOT.lvl === 2 && opp < base) b = Math.min(mine, opp + 1);
  else if (opp/opN > base*1.6 && Math.random() < (BOT.lvl === 2 ? .7 : .4)) b = brnd(0, base*.3);
  else b = base*brnd(BOT.lvl === 2 ? .85 : .6, BOT.lvl === 2 ? 1.25 : 1.3);
  return clamp(Math.round(b), 0, mine);
}
// Hölzer: wer das letzte nimmt, verliert. Gewinnzug mit stufenabhängiger Wahrscheinlichkeit
function botNim(piles, T){
  const memo = {};
  const win = a => {
    if (a.every(x => x === 0)) return true;
    const key = a.join(','); if (key in memo) return memo[key];
    let r = false;
    a.forEach((n, pi) => T.forEach(k => { if (!r && k <= n) { const b = a.slice(); b[pi] -= k; if (!win(b)) r = true; } }));
    return memo[key] = r;
  };
  const moves = [];
  piles.forEach((n, pi) => T.forEach(k => { if (k <= n) moves.push([pi, k]); }));
  const good = moves.filter(([pi, k]) => { const b = piles.slice(); b[pi] -= k; return !win(b); });
  if (good.length && Math.random() < bv(BOTP.nim)) return pickOne(good);

const Snd = {
  ctx:null, on:true,
  init(){ if (!this.on) return; try { if (!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch(e) {} },
  tone(f, d=.1, type='square', v=.04, w=0, slide=0){
    if (!this.on || !this.ctx) return;
    try {
      const t = this.ctx.currentTime + w, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f+slide), t+d);
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t+d);
      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t+d+.03);
    } catch(e) {}
  },
  buzz(p){ this.tone(p ? 740 : 520, .09, 'square', .045); },
  tick(){ this.tone(880, .05, 'sine', .05); },
  go(){ this.tone(1320, .16, 'square', .045); },
  good(){ this.tone(660, .08, 'square', .04); this.tone(990, .14, 'square', .04, .08); },
  bad(){ this.tone(260, .28, 'sawtooth', .045, 0, -150); },
  hit(){ this.tone(180, .16, 'sawtooth', .06, 0, -110); this.tone(90, .2, 'square', .035, .02); },
  jump(p){ this.tone(p ? 500 : 380, .1, 'triangle', .05, 0, 300); },
  crash(){ this.tone(120, .4, 'sawtooth', .07, 0, -80); },
  senso(i){ this.tone([330,415,494,659][i], .3, 'triangle', .08); },
  win(){ [523,659,784,1046].forEach((f,i) => this.tone(f, .2, 'square', .045, i*.13)); },
};

// pred wählt optional nur eine Sorte Fragen aus; ist die aufgebraucht, beginnt nur diese Sorte von vorn
function drawQ(cat, pool, pred){
  const ok = i => !pred || pred(pool[i]);
  let u = new Set(used[cat] || []);
  let free = pool.map((_,i)=>i).filter(i => ok(i) && !u.has(i));
  if (!free.length) { u = new Set([...u].filter(i => !ok(i))); free = pool.map((_,i)=>i).filter(ok); }
  if (!free.length) return drawQ(cat, pool);
  const i = pickOne(free);
  u.add(i); used[cat] = [...u]; saveUsed();
  return pool[i];
}

    const wx = tx - cw*.83, lx = tx + tw - cw*.17, topY = th - ch*.92, spX = tx + tw/2 - cw/2;
    const endW = TR(spX, th + spH - 2), endL = TR(lx, th*.26 - 18);
    let stage = 0, alive = true;
    const anims = [];
    const cv = el.querySelector('.vfx'), ctx = cv.getContext && cv.getContext('2d');
    const fireworks = () => {
      if (!ctx || REDUCE) return;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
      let parts = [], lastT = 0, nextB = 0, t0 = 0;
      const burst = () => {
        const x = innerWidth*(.12 + Math.random()*.76), y = innerHeight*(.08 + Math.random()*.4), c = pickOne([col, col, '#f9f002', '#ffffff']);
        for (let k = 0; k < 80; k++) { const a = Math.random()*Math.PI*2, v = 90 + Math.random()*260; parts.push({x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, life: 1, c}); }
        Snd.tone(160 + Math.random()*120, .35, 'triangle', .035, 0, -60);
      };
      const step = now => {
        if (!alive) return;
        const dt = lastT ? Math.min(.033, (now - lastT)/1000) : .016; lastT = now;
        if (!t0) t0 = now;
        if (now >= nextB) { burst(); nextB = now + (now - t0 < 4500 ? 350 + Math.random()*250 : 1200 + Math.random()*900); }
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        for (const p of parts) {
          p.vy += 170*dt; p.vx *= .985; p.vy *= .985; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt*.65;
          ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 2.6, 2.6);
        }
        ctx.globalAlpha = 1; parts = parts.filter(p => p.life > 0);
        requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    };
    const setEnd = () => {
      if (stage) return; stage = 1;
      anims.forEach(a => { try { a.finish(); } catch(e) {} });
      cam.style.transform = 'translateY(0px)'; WN.style.transform = endW; LS.style.transform = endL;

      if (stage !== 1) return; stage = 2; alive = false; cur = null;

    };
    const proceed = () => { if (stage === 0) setEnd(); else if (el.classList.contains('ready')) close(); };
    el.addEventListener('click', proceed);
    el.querySelector('#vnext').addEventListener('click', e => { e.stopPropagation(); if (stage === 0) setEnd(); close(); });
    cur = { key: k => { if (k === 'enter' || k === ' ') proceed(); } };
    requestAnimationFrame(() => el.classList.add('on'));
    if (!cam.animate || REDUCE) { setTimeout(setEnd, 500); return; }
    const DUR = 4200, DEL = 350;
    cam.style.transform = `translateY(${-(S - vh)}px)`;
    WN.style.transform = TR(wx - 30, 0); LS.style.transform = TR(lx + 30, 0);
    WN.classList.add('climb'); LS.classList.add('climb');
    anims.push(cam.animate([{transform: `translateY(${-(S - vh)}px)`}, {transform: 'translateY(0px)'}], {duration: DUR, delay: DEL, easing: 'cubic-bezier(.45,0,.35,1)', fill: 'forwards'}));
    const k = [{transform: TR(wx - 30, 0)}], n = 12;
    for (let j = 1; j <= n; j++) { const f = j/n; k.push({transform: TR(wx - (j % 2 ? 40 : 0), 8 + f*(topY - 8), j % 2 ? -12 : 0), offset: .03 + f*.75}); }
    k.push({transform: TR(spX - 46, th, 0), offset: .86});
    k.push({transform: TR(spX - 12, th + spH*.55 + 50, -200), offset: .94});
    k.push({transform: TR(spX, th + spH - 2, -360), offset: 1});
    anims.push(WN.animate(k, {duration: DUR, delay: DEL, fill: 'forwards'}));
    const kl = [{transform: TR(lx + 30, 0)}], m = 6;
    for (let j = 1; j <= m; j++) kl.push({transform: TR(lx + (j % 2 ? 5 : 0), (j/m)*th*.26, j % 2 ? 7 : 0), offset: .04 + (j/m)*.62});
    kl.push({transform: TR(lx + 3, th*.26 - 18, 12), offset: .76});
    kl.push({transform: endL, offset: 1});
    anims.push(LS.animate(kl, {duration: DUR, delay: DEL, easing: 'ease-in-out', fill: 'forwards'}));
    Snd.tone(180, 1.6, 'sawtooth', .025, .3, 700);
    setTimeout(() => { if (!stage) WN.classList.remove('climb'); }, DEL + DUR*.84);
    setTimeout(() => { if (!stage) setEnd(); }, DEL + DUR + 60);
  });

  };
  requestAnimationFrame(step);
}

/* Fortschrittsbalken-Countdown */
// Online: läuft die Zeit ab, wartet der Gastgeber noch kurz auf Eingaben des Gasts, die vor Ablauf gedrückt wurden.
// late(t) sagt, ob ein Druck zur Zeit t außerhalb der Frist lag (nach Ablauf oder noch vor dem Start, also im vorigen Zug).
// Den Balken zeichnet der Gast selbst (data-cd).
function makeCd(bar, isOver){
  let tok = 0, T0 = 0, FULL = 0, on = false;
  const freeze = () => { if (bar && bar.hasAttribute('data-cd')) { bar.removeAttribute('data-cd'); bar.removeAttribute('data-cc'); bar.removeAttribute('data-v'); } };
  return {
    run(ms, color, fn, full = ms){
      const my = ++tok, t0 = performance.now() - (full - ms);
      T0 = t0; FULL = full; on = true;
      if (bar) { bar.style.background = color; if (NET.on) { bar.dataset.v = ''; bar.dataset.cd = `${Math.round(t0*10)/10} ${full}`; bar.dataset.cc = color; } }
      const step = () => {
        if (my !== tok) return;
        if (isOver()) { on = false; freeze(); return; }
        const el = (performance.now()-t0)/full;
        if (bar) bar.style.width = Math.max(0, 100-el*100) + '%';
        if (el >= 1 + holdMs()/full) {
          netSeqRun(); if (my !== tok) return;
          on = false; freeze(); fn();
        } else frame(step);
      };
      frame(step);
    },
    stop(){ tok++; on = false; freeze(); },
    late(t){ return on && (t > T0 + FULL || t < T0); }
  };
}

/* ---------- Reaktion mit Fallen ---------- */
function reaktion(done, need=LEN.react){
  const s = G.start.slice();
  const FAKES = ['Jetzt?','Grün?','Los?','Fast!'];
  function round(){
    const tR = performance.now();   // online: Drücke von vor dieser Runde (Gast sah noch die alte) zählen nicht
    pads(true);
    view(`<div class="stage cut" id="st"><div class="big" id="big">Warten …</div><div class="sub" id="sb">Nur bei Grün drücken. Gelb ist eine Falle.</div></div>`);
    const st = $('#st'), big = $('#big');
    let green = false, over = false, t0 = 0;
    const total = 1800 + Math.random()*3600;
    const nf = Math.random() < .6 ? 1 + (Math.random() < .35 ? 1 : 0) : 0;
    for (let i=0; i<nf; i++){
      const at = 500 + Math.random()*(total-1100);
      later(() => {
        if (over || green) return;
        st.classList.add('fake'); big.textContent = pickOne(FAKES); Snd.tick();
        if (BOT.on && Math.random() < bv(BOTP.fake)) later(() => { if (!over && !green) buzz(1); }, brnd(170, 330));
        later(() => { if (over || green) return; st.classList.remove('fake'); big.textContent = 'Warten …'; }, 260);
      }, at);
    }
    later(() => {
      if (over) return;
      green = true; st.classList.remove('fake'); st.classList.add('go'); big.textContent = 'Jetzt!'; Snd.go(); t0 = performance.now();
      if (BOT.on) { const [m, sd] = bv(BOTP.react); later(() => { if (!over) buzz(1); }, Math.max(160, m + gauss()*sd)); }
      const slow = () => {
        netSeqRun(); if (over) return;
        // online: ein Druck von vor Ablauf kann noch in der Warteschlange stehen
        if (NET.seq.some(e => e.c === cur)) return later(slow, 15);
        over = true; cur = null; st.classList.remove('go'); big.textContent = 'Zu langsam!'; $('#sb').innerHTML = 'Keiner hat gedrückt, nochmal.'; nextPt(round, 1300*WAIT);
      };
      later(slow, 2500 + holdMs());
    }, total);
    // online zählt der Moment des Drückens (beim Gast: das Bild, das er gerade vor sich hatte), nicht die Ankunft
    cur = { seq: true, buzz: p => {
      if (over) return;
      const t = inT();
      if (t < tR || (green && t - t0 > 2500)) return;
      over = true; cur = null;
      let w, msg;
      if (!green || t < t0) { w = 1-p; msg = `${esc(P[p].name)} war zu früh`; st.classList.remove('fake', 'go'); st.classList.add('bad'); big.textContent = 'Zu früh!'; Snd.bad(); }
      else { w = p; const ms = Math.round(t-t0); note.react(p, ms); msg = `${esc(P[p].name)}: ${ms} ms`; big.textContent = 'Treffer!'; }
      if (subpt(w)) s[w]++;
      $('#sb').innerHTML = `${msg}.${zcTail(w)}`;
      after(s, need, done, round);
    }};
  }
  round();
}

      <button class="link" id="skip">Überspringen</button></div>`);
    const st = $('#st');
    const cd = makeCd($('#qt'), () => over);
    const evaluate = () => {
      if (over) return; over = true; open = false; cd.stop(); cur = null;
      if (R.stop) R.stop();
      main.querySelectorAll('.duo').forEach(b => b.disabled = true);
      const sk = $('#skip'); if (sk) sk.remove();
      const ol = $('#opts'); if (ol) { ol.style.visibility = 'visible'; ol.querySelectorAll('.oli')[R.correct].classList.add('right'); }
      [0,1].forEach(p => {
        const b = main.querySelector(`.duo[data-p="${p}"][data-i="${R.correct}"]`); if (b) b.classList.add('right');
        if (ans[p] === null) { $('#pk'+p).textContent = 'keine Antwort'; return; }
        const ok = ans[p] === R.correct; (ok ? note.correct : note.wrong)(p);
        $('#pk'+p).textContent = `${R.labels ? R.labels[ans[p]] : 'Antwort ' + (ans[p]+1)} ${ok ? '✓' : '✗'} ${f1(at[p]/1000)} s${mark[p] ? ', ' + mark[p] : ''}`;
      });
      const ok = [0,1].filter(p => ans[p] === R.correct);
      const w = ok.length === 2 ? (at[0] <= at[1] ? 0 : 1) : ok.length === 1 ? ok[0] : -1;
      if (w >= 0) { Snd.good(); if (subpt(w)) s[w]++; } else Snd.bad();
      const ex = R.after ? R.after() : '';
      st.innerHTML = (w >= 0 ? `${nm(w)} ${ok.length === 2 ? 'war schneller' : 'liegt richtig'}.${zcTail(w)}` : 'Kein Punkt.') + (R.labels ? ` Richtig ist: <b>${R.labels[R.correct]}</b>.` : '') + (ex ? ` <span class="ex">${ex}</span>` : '');
      const wait = ex ? 3000 : 2400;
      if (w < 0) nextPt(round, wait*WAIT); else after(s, need, done, round, wait);
    };
    const answer = (p, i) => {
      if (!open || over || ans[p] !== null || i >= n) return;
      const t = inT(); if (t < t0 || cd.late(t)) return;
      ans[p] = i; at[p] = t - t0; mark[p] = R.mark ? R.mark(t - t0) : '';
      Snd.buzz(p); $('#pk'+p).textContent = '✓ geantwortet';
      main.querySelectorAll(`.duo[data-p="${p}"]`).forEach(b => b.disabled = true);
      if (ans[0] !== null && ans[1] !== null) evaluate();
    };
    main.querySelectorAll('.duo').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); answer(+b.dataset.p, +b.dataset.i); }));
    $('#skip').onclick = () => { over = true; cd.stop(); cur = null; if (R.stop) R.stop(); round(); };
    const go = () => {
      if (over) return;
      const ol = $('#opts'); if (ol) ol.style.visibility = 'visible';
      if (R.pre) $('#pre').innerHTML = R.preAfter || '';
      main.querySelectorAll('.duo').forEach(b => b.disabled = false);
      open = true; t0 = performance.now();
      st.textContent = 'Beide antworten gleichzeitig. Wer schneller richtig liegt, holt den Punkt.';
      if (R.start) R.start();
      cd.run(R.ms || 10000, 'var(--acc)', evaluate);
      if (BOT.on) botDuo(o.bot || 'quiz', R, n, i => answer(1, i));
    };
    cur = { row: (p, i) => answer(p, i) };
    if (R.pre) { if (R.onPre) R.onPre(); later(go, R.preMs || 1500); } else go();
  }
  round();
}

function quiz(done){
  duoGame(done, () => {
    const [q,o,c,cat] = drawQ('mc', MC);
    const idx = shuffle([0,1,2,3]);
    return { kick:cat, title:esc(q), opts:idx.map(i => esc(o[i])), correct:idx.indexOf(c), ms: clamp(7000 + q.length*40, 8000, 14000) };
  });
}

function wahrfalsch(done){
  duoGame(done, () => {
    const want = Math.random() < .5;
    const [t, truth, ex] = drawQ('wf', WF, x => !!x[1] === want);
    return { kick:'Blitzrunde: wahr oder falsch?', title:esc(t), opts:['Wahr','Falsch'], labels:['Wahr','Falsch'], correct: truth ? 0 : 1,
             ms: clamp(3000 + t.length*22, 3000, 5500), after: () => ex ? esc(ex) : '' };
  }, {need: LEN.wf, bot:'wf'});
}

/* Emoji-Rätsel: die Emojis erscheinen nacheinander, wer früher richtig antwortet, braucht weniger Hinweise */
const splitEmoji = str => (typeof Intl !== 'undefined' && Intl.Segmenter) ? [...new Intl.Segmenter('de', {granularity:'grapheme'}).segment(str)].map(x => x.segment) : [...str];
function emoji(done){
  duoGame(done, () => {
    const [e, right, wrong, cat] = drawQ('emo', EMO);
    const parts = splitEmoji(e), opts = shuffle([right, ...wrong]);
    let shown = 1, stopped = false;
    const step = () => { if (stopped || shown >= parts.length) return; const el = $('#emo'); if (!el) return; el.textContent = parts.slice(0, ++shown).join(''); later(step, 1800); };
    return { kick:`Emoji-Rätsel: ${cat}`, title:`<span class="emo" id="emo">${parts[0]}</span>`, opts:opts.map(esc), correct:opts.indexOf(right),
      ms: parts.length*1800 + 5000,
      start: () => later(step, 1800), stop: () => { stopped = true; },
      mark: el => `nach ${NET.vt != null ? Math.min(parts.length, 1 + Math.floor(el/1800)) : shown} von ${parts.length} Emojis`,
      after: () => { const el = $('#emo'); if (el) el.textContent = e; return ''; } };
  }, {need: LEN.emo, bot:'emo'});
}

function blitzblick(done){
  duoGame(done, () => {
    const target = 8 + R0(17), pts = []; let guard = 0;
    while (pts.length < target && guard++ < 3000) {
      const x = 4 + Math.random()*90, y = 6 + Math.random()*82;
      if (pts.every(p => Math.hypot((p[0]-x)*1.8, p[1]-y) > 9)) pts.push([x,y]);
    }
    const N = pts.length, cols = ['#ff2a6d','#05d9e8','#f9f002'];
    const dots = pts.map(([x,y]) => { const c = pickOne(cols); return `<i class="dot" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%;background:${c};box-shadow:0 0 8px ${c}"></i>`; }).join('');
    const below = R0(4);   // so viele Antworten liegen unter der richtigen
    const lo = shuffle([1,2,3].filter(d => N - d > 0)).slice(0, below).map(d => N - d);
    const cand = [...lo, ...shuffle([1,2,3]).slice(0, 3 - lo.length).map(d => N + d)];
    const opts = [N, ...cand].sort((a,b) => a-b);
    return { kick:'Blitzblick', title:'Wie viele Punkte blitzen auf?',
      pre:'<div class="dotbox" id="dots"><span class="dmsg">Achtung …</span></div>',
      onPre: () => { const box = $('#dots'); later(() => { if (box && box.isConnected) box.innerHTML = dots; }, 800); },
      preMs: 800 + 1300, preAfter:'<div class="dotbox"><span class="dmsg">Wie viele waren es?</span></div>',
      opts: opts.map(String), correct: opts.indexOf(N), ms: 7000, after: () => `Es waren ${N}.` };
  }, {need: LEN.blitz, bot:'blitz'});
}

function chainGame(done, kind){
  const s = G.start.slice(), isT = kind === 'T';
  let p = 0, ref, cat, used, streak;
  const need = () => isT ? LEN.chainT : LEN.chainM;

  const all = () => isT ? EV.map(e => ({n:e[0], v:e[1]})) : cat.items.map(e => ({n:e[0], v:e[1]}));
  const fair = (a, b) => isT ? Math.abs(a.v - b.v) >= 3 : Math.max(a.v, b.v) / Math.min(a.v, b.v) >= cat.margin;
  function startChain(){
    if (!isT) cat = pickOne(CHAINS);

    ref = pickOne(all()); used.add(ref.n);
    turn();
  }
  function turn(){
    const cand = all().filter(x => !used.has(x.n) && fair(ref, x));
    if (!cand.length) return startChain();
    const nx = pickOne(cand); used.add(nx.n);
    let over = false;

/* ---------- Tipp-Spiele mit Lese-Sperre und Konter (Wortsalat, Kopfrechnen) ---------- */
function typeGame(done, o){
  const s = G.start.slice(); let r = 0;
  function round(){
    const task = o.next(r);
    let over = false, phase = 'read', ans = -1, konter = false, botAt = Infinity;
    const lockUntil = [0,0], tR = performance.now();
    pads(true);
    view(`<div class="card cut"><div class="kick">${o.kick}</div>${task.html}
      <div class="hint" id="hn">&nbsp;</div><div id="ar"></div>
      <div class="qbar"><i id="qt"></i></div>
      <div class="status" id="st">Lesen … wer jetzt schon buzzert, ist 2 Sekunden gesperrt.</div>
      <button class="link" id="skip">Überspringen</button></div>`);
    const st = $('#st');
    const cd = makeCd($('#qt'), () => over);
    const end = (w, html) => {
      over = true; cd.stop(); cur = null; pads(false);
      const sk = $('#skip'); if (sk) sk.remove();
      $('#ar').innerHTML = ''; r++;
      if (w >= 0) { if (subpt(w)) s[w]++; }
      st.innerHTML = `${html}${w >= 0 ? zcTail(w) : ''}<br><span class="ex">Lösung: ${task.show}</span>`;
      if (w < 0) nextPt(round, 2400*WAIT); else after(s, o.need(), done, round, 2200);
    };
    $('#skip').onclick = () => { over = true; cd.stop(); cur = null; round(); };
    if (task.hints) task.hints.forEach(([ms, txt]) => later(() => { if (!over && ans < 0) $('#hn').textContent = txt; }, ms));
    const input = p => {
      ans = p; pads(false); cur = {};
      st.innerHTML = konter ? `Konter-Chance für ${nm(p)}: eintippen und Enter drücken` : `${nm(p)}, eintippen und Enter drücken`;
      $('#ar').innerHTML = `<input class="ansin${o.wide ? ' wide' : ''}" id="ai" type="text" inputmode="${o.numeric ? 'numeric' : 'text'}" autocomplete="off" autocapitalize="characters" spellcheck="false"><br><button class="btn" id="ok">Antwort prüfen</button>`;
      const inp = $('#ai'), bot = isBot(p), remote = isRemote(p);
      if (bot) { inp.readOnly = true; inp.placeholder = '🤖 tippt …'; $('#ok').style.display = 'none'; }
      else if (remote) { inp.readOnly = true; inp.dataset.net = 'in'; inp.placeholder = `⌨️ ${P[p].name} tippt …`; $('#ok').dataset.net = 'ok'; $('#ok').style.display = 'none'; }
      else inp.focus();
      const check = () => {
        if (over || ans !== p || !inp.value.trim() || cd.late(inT())) return;
        if (task.ok(inp.value)) { note.correct(p); Snd.good(); end(p, konter ? `Konter sitzt! ${nm(p)} hat es.` : `${nm(p)} hat es!`); }
        else miss(false);
      };
      $('#ok').onclick = check;
      if (!bot && !remote) inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
      if (remote) NET.text = v => { if (!inp.isConnected || over || ans !== p) return false; inp.value = v; check(); return true; };
      cd.run(konter ? o.konterMs : o.answerMs, `var(--p${p+1})`, () => miss(true));
      if (bot) botTypeAnswer(o, task, konter, botAt, inp, check);
    };
    const miss = slow => {
      if (over) return;
      cd.stop(); note.wrong(ans); Snd.bad();
      if (!konter) { konter = true; const was = ans; $('#ar').innerHTML = ''; st.innerHTML = `${nm(was)} ${slow ? 'war zu langsam' : 'liegt falsch'}.`; later(() => { if (!over) input(1 - was); }, 900); return; }
      end(-1, `${nm(ans)} ${slow ? 'war beim Konter zu langsam' : 'liegt beim Konter auch falsch'}, kein Punkt.`);
    };
    let tb = 0;
    cur = { seq: true, buzz: p => {
      if (over || ans >= 0) return;
      const now = inT();
      if (now < tR) return;   // Druck aus der vorigen Runde
      if (phase !== 'buzz' || now < tb) { lockUntil[p] = now + 2000 + o.readMs; Snd.bad(); st.innerHTML = `${nm(p)} war zu früh und ist kurz gesperrt.`; return; }
      if (now < lockUntil[p] || cd.late(now)) return;
      Snd.buzz(p); cd.stop(); input(p);
    }};
    later(() => {
      if (over) return;
      phase = 'buzz'; tb = performance.now(); st.textContent = o.buzzTxt;
      if (BOT.on && o.bot) { const tt = o.bot.solve(task); botAt = performance.now() + tt; if (tt < o.buzzMs - 400) later(() => { if (!over && ans < 0) buzz(1); }, tt); }
      cd.run(o.buzzMs, 'var(--acc)', () => { Snd.bad(); end(-1, 'Zeit abgelaufen, niemand hat gebuzzert.'); });
    }, o.readMs);
  }
  round();
}

/* ---------- Wortsalat ---------- */
const norm = s => s.toUpperCase().replace(/Ä/g,'AE').replace(/Ö/g,'OE').replace(/Ü/g,'UE').replace(/ß/g,'SS').replace(/[^A-Z]/g,'');
function scramble(w){
  const same = s => [...s].filter((c,i) => c === w[i]).length / w.length;
  let s = w;
  for (let k=0; k<60 && (s === w || same(s) > .4); k++) s = shuffle(w.split('')).join('');
  return s;
}
function wortsalat(done){
  typeGame(done, {
    kick:'Wortsalat', need: () => LEN.wort, bot:{solve: task => bv(BOTP.word)*(.6 + .12*task.show.length)*Math.exp(gauss()*.35)*1000}, readMs:1500, buzzMs:30000, answerMs:15000, konterMs:12000, wide:true,
    buzzTxt:'Gelöst? Buzzern!',
    next: () => {
      const word = drawQ('ws', WORDS), scr = scramble(word);
      return { html:`<h2 class="q">Welches Wort steckt darin?</h2><div class="letters">${[...scr].map(c => `<span>${c}</span>`).join('')}</div>`,
        show: word, ok: v => norm(v) === word,
        hints: [[11500, `Tipp: beginnt mit ${word[0]}`], [19500, `Tipp: beginnt mit ${word[0]} und endet mit ${word[word.length-1]}`]] };
    }
  });
}

/* ---------- Kopfrechnen: wird mit jeder Aufgabe schwerer ---------- */
function mathTask(level){
  const R = (a,b) => a + R0(b-a+1);
  switch (Math.min(5, R0(2) + level)) {
    case 0: { const a = R(12,49), b = R(12,49); return [`${a} + ${b}`, a+b]; }
    case 1: { const a = R(40,120), b = R(11,39); return [`${a} − ${b}`, a-b]; }
    case 2: { const a = R(4,12), b = R(4,12); return [`${a} × ${b}`, a*b]; }
    case 3: { const a = R(13,29), b = R(3,9); return [`${a} × ${b}`, a*b]; }
    case 4: { const a = R(6,19), b = R(3,9), c = R(11,60); return [`${a} × ${b} − ${c}`, a*b-c]; }
    default: { const b = R(4,15), q = R(6,19), c = R(5,40); return [`${b*q} : ${b} + ${c}`, q+c]; }
  }
}
// Tippzeit nach dem Buzzern: am Handy braucht schon die Tastatur einen Moment
// online braucht der Gast am Handy dieselbe Tippzeit wie am Handy-Gerät
const rechnenS = () => TOUCH || NET.on ? 6 : 4;
function rechnen(done){
  typeGame(done, {
    kick:'Kopfrechnen', need: () => LEN.rechnen, bot:{solve: task => bv(BOTP.math)*(1 + .35*Math.min(5, task.lvl || 0))*Math.exp(gauss()*.3)*1000, ok: BOTP.mathOk}, readMs:1000, buzzMs:15000, answerMs: rechnenS()*1000, konterMs: rechnenS()*1000 + 2000, numeric:true,
    buzzTxt:`Ergebnis im Kopf? Buzzern! Danach bleiben nur ${rechnenS()} Sekunden zum Tippen.`,
    next: r => { const [t, res] = mathTask(r); return { html:`<div class="task">${t}</div>`, show: String(res), lvl: r, ok: v => parseInt(v, 10) === res }; }
  });
}

/* ---------- Schätzen: direkt nacheinander tippen, ohne Extra-Klick ---------- */
function parseNum(str){
  let t = String(str).trim().replace(/\s/g,'');
  if (!t) return NaN;
  if (t.includes(',')) t = t.replace(/\./g,'').replace(',','.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g,'');
  return parseFloat(t);
}
function schaetzen(done){

    else if (remote) NET.text = v => { if (!inp.isConnected || isNaN(parseNum(v))) return false; inp.value = v; submit(); return true; };
    else inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  }
  function reveal(){

    $('#nx').onclick = () => fin ? done(w, s.slice()) : start();

/* ---------- Takt-Tauziehen (wer genauer im Takt drückt, zieht) ---------- */
function tauziehen(done){
  const s = G.start.slice(); let r = 0;
  function round(){
    let over = false, pos = 0;
    const N = 8, LEAD = 1900, TRAVEL = 1700, WIN = 260, MAXS = 6, tR = performance.now();
    pads(true);
    view(`<div class="stage cut neutral"><div class="sub" id="ts">Runde ${r+1}: drückt genau, wenn eine Note die gelbe Linie trifft. Wer genauer ist, zieht das Seil. Fehlklicks ziehen für den Gegner.</div>
      <div class="track" id="trk"><i class="hitline"></i></div>
      <div class="rope"><i class="knot" id="knot"></i></div>
      <div class="tugnames"><span class="c1">◀ ${esc(P[0].name)} <b id="d0"></b></span><span class="c2"><b id="d1"></b> ${esc(P[1].name)} ▶</span></div></div>`);
    const trk = $('#trk'), knot = $('#knot');
    const base = Math.max(430, 760 - r*45);
    const beats = []; let t = performance.now() + LEAD;
    for (let i = 0; i < N; i++) { beats.push({t, judged:[null,null], done:false}); t += base * pickOne([.75, 1, 1, 1.25, 1.5]); }
    // online zeichnet der Gast die Noten selbst nach der gemeinsamen Uhr (data-bt: Schlagzeit beim Gastgeber)
    const addEl = (b, cls) => { b.el = document.createElement('i'); b.el.className = 'note' + (cls ? ' ' + cls : ''); if (NET.on) { b.el.dataset.v = ''; b.el.dataset.bt = Math.round(b.t*10)/10; b.el.dataset.tr = TRAVEL; } trk.appendChild(b.el); };
    beats.forEach(b => addEl(b));
    const botBeat = b => { if (!BOT.on) return; const [sd, miss] = bv(BOTP.tug); if (Math.random() < miss) return; later(() => { if (!over) buzz(1); }, Math.max(0, b.t - performance.now() + gauss()*sd)); };
    beats.forEach(botBeat);
    const setK = () => { knot.style.left = (50 + pos*(46/MAXS)) + '%'; };
    setK();
    const pull = w => { pos = clamp(pos + (w === 0 ? -1 : 1), -MAXS, MAXS); setK(); };
    const show = (p, txt) => { const e = $('#d'+p); if (e) e.textContent = txt; };
    const judge = b => {
      if (b.done) return; b.done = true;
      const d0 = b.judged[0] == null ? WIN : b.judged[0], d1 = b.judged[1] == null ? WIN : b.judged[1];
      if (d0 < d1) pull(0); else if (d1 < d0) pull(1);
      b.el.classList.add('gone');
    };
    cur = { buzz: p => {
      if (over) return;
      const now = inT();
      if (now < tR) return;   // Druck aus der Pause vor dieser Runde
      let best = null;
      for (const b of beats) { if (b.done || b.judged[p] != null) continue; const d = Math.abs(now - b.t); if (d <= WIN && (!best || d < Math.abs(now - best.t))) best = b; }
      if (!best) {
        // Note war schon gewertet, bevor der Druck ankam: zählt weder als Treffer noch als Fehlklick
        if (beats.some(b => b.done && b.judged[p] == null && Math.abs(now - b.t) <= WIN)) return;
        pull(1-p); show(p, 'Fehlklick'); Snd.bad(); return;
      }
      const dev = Math.round(Math.abs(now - best.t)); best.judged[p] = dev; show(p, `±${dev} ms`); Snd.buzz(p);
      if (best.judged[0] != null && best.judged[1] != null) judge(best);
    }};
    const end = () => {
      if (over) return;
      if (pos === 0) {
        const b = {t: performance.now() + 1300, judged:[null,null], done:false}; addEl(b, 'gold'); beats.push(b); botBeat(b);
        $('#ts').textContent = 'Gleichstand: eine Entscheidungs-Note!';
        return frame(loop);
      }
      over = true; cur = null; r++;
      const w = pos < 0 ? 0 : 1;
      if (subpt(w)) s[w]++;
      $('#ts').innerHTML = wonMsg(w, 'war genauer', 'und gewinnt die Runde');
      after(s, LEN.tug, done, round, 2200);
    };
    const loop = () => {
      if (over) return;
      const now = performance.now();
      for (const b of beats) {
        const f = 1 - (b.t - now)/TRAVEL;
        b.el.style.left = (12 + (1 - f)*88) + '%';
        b.el.style.opacity = f < 0 ? 0 : 1;
        if (!b.ticked && now >= b.t) { b.ticked = true; sndLocal(() => Snd.tick()); }
        if (!b.done && now > b.t + WIN + holdMs()) judge(b);
      }
      if (beats.every(b => b.done)) return end();
      frame(loop);
    };
    frame(loop);
  }
  round();
}

  const show = () => {
