    // deadT: Zeitpunkt des Crashs, null solange der Läufer lebt
    const rn = [{y:0,vy:0,buf:0,deadT:null},{y:0,vy:0,buf:0,deadT:null}];
    let obs = [], queue = [], items = [], warn = [0,0], t = 0, speed = V(0), dist = 0, since = 0, gap = V(0)*.9;
    let over = false, started = false, last = 0, label = '3', lsize = 56;
    // Zeitausgleich online: Sprünge des Gasts kommen verspätet an. Der Gastgeber merkt sich die letzten 1,7 s und rechnet
    // den Läufer des Gasts ab dem Moment des Drückens neu. Ein Crash des Gasts gilt erst, wenn kein rettender Sprung mehr unterwegs sein kann.
    const rem = () => isRemote(1) && holdMs() > 0;
    const hist = []; let frozen = false, ja = 0;
    // Vorlauf: online entstehen Hindernisse LT Sekunden bevor sie ins Bild kommen (rechts außerhalb). Muster, Abstände und Zeitpunkt
    // im Bild sind dieselben wie offline (dort ist LT = 0), aber der Gast kennt sie schon, wenn sie auftauchen.
    const LT = online ? clamp(holdMs()/1000 + .15, .35, .8) : 0;
    let tl = 0, distl = 0;
    const edge = () => W + 10 + (distl - dist);
    const block = (w = 14+R0(16), h = 18+R0(22)) => ({w, h, b:0, fly:false});
    const drone = () => ({w:28, h:12, b:RH+9, fly:true});
    // Hindernis-Muster: [Hindernis, Zeit bis zum nächsten in s]
    const pattern = () => {
      const lvl = Math.min(1, tl/14), r = Math.random();
      const free = () => AIR + .26 + Math.random()*Math.max(.12, .6 - tl*.03);
      if (tl < 1.5) return [[block(), free()]];
      if (r < .2 + .15*lvl) return [[drone(), free()]];
      if (tl > 3 && r < .38 + .2*lvl) return [[block(), AIR + .13 + Math.random()*.06], [drone(), free()]];   // Block, dann gleich Drohne
      if (tl > 6 && r < .52 + .2*lvl) return [[drone(), .34 + Math.random()*.1], [block(), free()]];         // Drohne, dann gleich Block
      if (tl > 5 && r < .64 + .15*lvl) return [[block(), AIR + .3 + Math.random()*.1], [block(), free()]];   // Doppelblock
      if (r < .74) return [[block(34 + R0(18), 14 + R0(10)), free()]];                                     // langer, flacher Block
      return [[block(), free()]];
    };
    const spawn = () => {
      if (!queue.length) queue = pattern();
      const [o, gt] = queue.shift();
      obs.push(Object.assign({x: edge()}, o));
      since = 0; gap = gt * V(tl);
      if (tl > 3 && !o.fly && !queue.length && Math.random() < .3) items.push({x: edge() + gap*.5, y: 34 + R0(14), taken:[false,false]});
    };
    // Störsender: schickt dem Gegner ein Extra-Hindernis mit fairem Abstand
    const sabotage = q => {
      const e = edge(), minGap = V(tl)*(AIR + .22);
      let x = e;
      obs.forEach(o => { if ((o.lane == null || o.lane === q) && Math.abs(o.x - x) < minGap) x = Math.max(x, o.x + minGap); });
      obs.push({x, w:16, h:20 + R0(6), b:0, fly:false, lane:q});
      since = Math.min(since, gap - (x - e) - minGap);
      warn[q] = t + 1.3 + LT; Snd.tone(300, .15, 'square', .04);
    };
    const bot = BOT.on ? {tgt:null, eps:0, skip:false} : null;
    const botStep = st => {
      const r = rn[1]; if (r.deadT != null) return;
      const inLane = o => o.lane == null || o.lane === 1;
      const ahead = obs.filter(o => inLane(o) && o.x + o.w > RX - 2).sort((a, b) => a.x - b.x);
      const tgt = ahead.find(o => !o.fly && !o.botDone);
      if (!tgt) return;
      if (bot.tgt !== tgt) { const [sd, miss] = bv(BOTP.sprint); bot.tgt = tgt; bot.eps = gauss()*sd*(1 + .25*Math.max(0, speed/V(0) - 1)); bot.skip = Math.random() < miss; }
      if (bot.skip || r.y > 0) return;
      const tIn = o => (o.x - (RX + RW - 3))/speed, tOut = o => (o.x + o.w - (RX + 3))/speed;
      const dsc = JV*JV - 2*GR*Math.max(1, tgt.h - 2);
      if (dsc <= 0) return;
      const ta = (JV - Math.sqrt(dsc))/GR, tb = (JV + Math.sqrt(dsc))/GR;
      let lo = tOut(tgt) - tb, hi = tIn(tgt) - ta;
      for (const o of ahead) {
        if (!o.fly) continue;
        if (o.x < tgt.x) lo = Math.max(lo, tOut(o) - .015);
        else if (o.x < tgt.x + tgt.w + speed*(AIR + .3)) hi = Math.min(hi, tIn(o) - (AIR - .02));
      }
      const want = hi > lo ? lo + .3*(hi - lo) : lo;
      if (want - bot.eps <= 0) { r.buf = st; tgt.botDone = true; }
    };
    // sh: so viel weiter rechts lagen die Hindernisse zum betrachteten Zeitpunkt
    const hitTest = (r, o, sh) => { const m = 3, x = o.x + sh; return RX+m < x+o.w && RX+RW-m > x && r.y+m < o.b+o.h && r.y+RH-m > o.b; };
    const shownDead = (r, p) => r.deadT != null && (over || p !== 1 || !rem() || performance.now() - r.deadT >= holdMs());
    const paintState = () => ({W, H, LH, RX, RW, RH, dist, speed, v0: V(0), started, over, items, warn, t, obs, rn: rn.map((r, p) => ({y: r.y, dead: shownDead(r, p)})), label, lsize});
    const draw = () => { const S = paintState(); if (ctx) sprintPaint(ctx, S); if (NET.on) netSprint(S, {ht: started && !frozen ? last : performance.now(), ac: K*(SPRINT.a + 2*SPRINT.a2*t), g: GR, jv: JV, fz: frozen, rn, ja}); };
    const end = () => {
      over = true; cur = null; Snd.crash();
      const m = Math.floor(dist/10);
      // Wer zuerst crasht, verliert. Crashen beide im selben Teilschritt, ist es ein Doppel-Crash
      const d0 = rn[0].deadT == null ? Infinity : rn[0].deadT, d1 = rn[1].deadT == null ? Infinity : rn[1].deadT, T = Math.min(d0, d1);
      if (d0 > T) rn[0].deadT = null;
      if (d1 > T) rn[1].deadT = null;
      let w = -1;
      if (d0 === T && d1 > T) w = 1; else if (d1 === T && d0 > T) w = 0;
      if (w >= 0) note.sprint(w, m);
      lsize = 30; label = w < 0 ? 'Doppel-Crash!' : `${P[1-w].name} crasht!`;
      draw();
      if (w >= 0) { if (subpt(w)) s[w]++; }
      $('#sinfo').innerHTML = sub(s) + (w >= 0 && G.zc === w ? ' <b class="zcn">❤️ zählt nicht</b>' : '');
      if (w < 0) nextPt(run, 1700*WAIT); else after(s, LEN.sprint, done, run, 1900);
    };
    // Physik in kleinen Teilschritten, damit bei hohem Tempo nichts durchgetunnelt wird
    const world = (h, st) => {
      t += h;
      speed = V(t);
      const dx = speed*h; dist += dx;
      for (const o of obs) o.x -= dx;
      for (const it of items) it.x -= dx;
      lead(h);
      if (bot) botStep(st - h*1000);
    };
    // Vorlauf: Zeit und Strecke, bei der neue Hindernisse entstehen
    const lead = h => { tl += h; const dl = V(tl)*h; distl += dl; since += dl; if (since >= gap) spawn(); };
    // ein Läufer, ein Teilschritt zur Uhrzeit st: Sprung, Schwerkraft, Aufprall, Rauten
    const runner = (p, st, h, sh) => {
      const r = rn[p];
      if (r.deadT != null) return;
      // Sprung genau ab dem Moment des Drückens: im Teilschritt nur die Zeit danach steigen (gleich für beide Seiten, auch online)
      let hj = h;
      if (r.y === 0 && r.buf && st >= r.buf && st - r.buf < 150) { r.vy = JV; hj = Math.min(h, (st - r.buf)/1000); r.buf = 0; if (isRemote(p)) sndLocal(() => Snd.jump(p)); else Snd.jump(p); }
      if (r.y > 0 || r.vy > 0) { r.vy -= GR*hj; r.y += r.vy*hj; if (r.y <= 0 && r.vy <= 0) { r.y = 0; r.vy = 0; } }
      if (obs.some(o => (o.lane == null || o.lane === p) && hitTest(r, o, sh))) { r.deadT = st; return; }
      for (const it of items) if (!it.taken[p] && RX < it.x + sh + 12 && RX + RW > it.x + sh && r.y + RH > it.y && r.y < it.y + 12) { it.taken[p] = true; sabotage(1-p); }
    };
    // Sprung des Gasts zum Zeitpunkt ct einbauen: Zustand von damals holen und bis jetzt neu rechnen
    const retro = ct => {
      const r = rn[1];
      ja = Math.max(ja, ct);
      if (r.deadT != null && ct > r.deadT) return;
      const k = hist.findIndex(e => e.t >= ct);
      if (k < 0) { if (r.deadT == null) r.buf = ct; return; }
      r.y = hist[k].y; r.vy = hist[k].vy; r.buf = ct; r.deadT = null;
      for (let j = k; j < hist.length; j++) {
        const e = hist[j];
        e.y = r.y; e.vy = r.vy; e.buf = r.buf;
        runner(1, e.t, e.h, dist - e.d);
        if (r.deadT != null) break;
      }
    };
    const loop = () => {
      if (over) return;
      const now = performance.now();
      if (!frozen) {
        const t1 = last, dt = clamp((now-last)/1000, 0, .05), R = rem();
        last = now;
        const n = Math.max(1, Math.ceil(dt/.008));
        for (let i=0; i<n; i++) {
          const h = dt/n, st = t1 + (now - t1)*(i + 1)/n;
          world(h, st);
          if (R) hist.push({t: st, h, d: dist, y: rn[1].y, vy: rn[1].vy, buf: rn[1].buf});
          runner(0, st, h, 0); runner(1, st, h, 0);
          if (rn[0].deadT != null || (!R && rn[1].deadT != null)) { frozen = true; break; }
        }
        // alte Hindernisse online erst spät wegwerfen, ein verspäteter Sprung braucht sie noch
        const keep = R ? -30 - speed*1.8 : -30;
        obs = obs.filter(o => o.x + o.w > keep); items = items.filter(it => it.x > keep);
        while (hist.length && hist[0].t < now - 1700) hist.shift();
      }
      draw();
      const d0 = rn[0].deadT == null ? Infinity : rn[0].deadT, d1 = rn[1].deadT == null ? Infinity : rn[1].deadT, T = Math.min(d0, d1);
      if (T < Infinity && now >= T + holdMs()) return end();
      frame(loop);
    };
    cur = { buzz: p => { if (over) return; if (p === 1 && rem()) retro(inT()); else rn[p].buf = performance.now(); } };
    draw();
    let n = 3; Snd.tick();
    const cdn = () => {
      n--;
      if (n > 0) { label = String(n); draw(); Snd.tick(); later(cdn, 700); return; }
      label = ''; started = true; Snd.go(); last = performance.now();
      for (let k = Math.round(LT/.008); k > 0; k--) lead(.008);
      frame(loop);
    };
    later(cdn, 700);
  }
  run();
}

/* ---------- Memory ---------- */
function memory(done){
  const SYM = ['⚡','🔥','💎','🚀','🎧','👾','🌙','⭐','🍀','🎲','🔮','🛸','🦊','🐙'];
  const pairs = LEN.mem*2 - 1, s = G.start.slice();
  const deck = shuffle(shuffle(SYM.slice()).slice(0, pairs).flatMap(x => [x, x]));
  let p = nextStarter(), open = [], lock = false, found = 0, over = false;
  const mem = {};
  pads(false);
  view(`<div class="card cut"><div class="kick">Memory: ${pairs} Paare, wer ein Paar findet, darf nochmal</div>
    <h2 class="who" id="who"></h2>
    <div class="mgrid">${deck.map((x,i) => `<button class="mcard" data-i="${i}"><span>${x}</span></button>`).join('')}</div>
    <div class="qbar"><i id="qt"></i></div>
    <div class="status" id="st">10 Sekunden pro Zug.</div></div>`);
  const cards = [...main.querySelectorAll('.mcard')], who = $('#who'), st = $('#st');
  const cd = makeCd($('#qt'), () => over);
  const botMem = () => {
    const me = p, all = deck.map((_, i) => i), live = i => !cards[i].classList.contains('done');
    const known = () => Object.keys(mem).map(Number).filter(live);
    const unknown = () => all.filter(i => live(i) && !(i in mem) && !open.includes(i));
    const pair = () => { const k = known(); for (const a of k) for (const b of k) if (a < b && mem[a] === mem[b]) return [a, b]; return null; };
    later(() => {
      if (over || p !== me || lock || open.length) return;
      const pr = pair(), u = unknown();
      const first = pr ? pr[0] : pickOne(u.length ? u : all.filter(live));
      flip(first);
      later(() => {
        if (over || p !== me || open.length !== 1) return;
        let second = pr ? pr[1] : known().find(i => i !== first && mem[i] === deck[first]);
        if (second == null) { const u2 = unknown().filter(i => i !== first); second = u2.length ? pickOne(u2) : all.find(i => i !== first && live(i)); }
        if (second != null) flip(second);
      }, brnd(650, 1000));
    }, brnd(800, 1400));
  };
  const turn = () => {
    who.innerHTML = `${nm(p)} ist dran`;
    if (isBot(p)) botMem();
    cd.run(10000, `var(--p${p+1})`, () => {
      if (lock || over) return;
      open.forEach(i => cards[i].classList.remove('up')); open = [];
      Snd.bad(); st.innerHTML = `${nm(p)} war zu langsam.`; p = 1-p; turn();
    });
  };
  const flip = i => {
    if (lock || over || open.includes(i) || cards[i].classList.contains('done') || cd.late(inT())) return;
    cards[i].classList.add('up'); open.push(i); Snd.tick(); if (BOT.on && Math.random() < bv(BOTP.memo)) mem[i] = deck[i];
    if (open.length < 2) return;
    lock = true; cd.stop();
    const [a, b] = open;
    if (deck[a] === deck[b]) {
      later(() => {
        open = []; lock = false; found++;
        const ok = subpt(p); if (ok) s[p]++; Snd.good();
        cards[a].classList.add('done', ok ? 'm'+p : 'mz'); cards[b].classList.add('done', ok ? 'm'+p : 'mz');
        if (s[p] >= LEN.mem || found === pairs) {
          over = true; cur = null; const mw = s[0] > s[1] ? 0 : s[1] > s[0] ? 1 : p; st.innerHTML = `${nm(mw)} hat gewonnen!`;
          nextPt(() => done(mw, s.slice()), 1600*WAIT); return;
        }
        st.innerHTML = ok ? `Paar! ${nm(p)} darf nochmal.` : `Paar!${zcTail(p)} ${nm(p)} darf nochmal.`;
        turn();
      }, 450);
    } else {
      later(() => { cards[a].classList.remove('up'); cards[b].classList.remove('up'); open = []; lock = false; st.textContent = 'Kein Paar.'; p = 1-p; turn(); }, 1100);
    }
  };
  cards.forEach(c => c.onclick = () => { if (mayAct(p)) flip(+c.dataset.i); });
  turn();
}

/* ---------- Heiße Kartoffel ---------- */
// Strafe fürs Danebendrücken: 0,45 s Sperre, dazu wird der Zeiger schneller, bis die Bombe weitergegeben ist
const BOMB_PEN = .15, BOMB_PEN_MAX = .45;
function bombe(done){
  const s = G.start.slice();
  function round(){
    let holder = nextStarter(), over = false, lockUntil = 0, speed = 1.1, zone, pen = 0, botAt = null;
    const fuse = 9000 + Math.random()*10000, t0 = performance.now();
    const newZone = () => { const w = .22, a = .06 + Math.random()*(.88 - w); zone = [a, a + w]; };
    newZone();
    pads(true);
    view(`<div class="stage cut neutral"><div class="sub">Wer die Bombe hat, drückt, wenn der Zeiger im grünen Feld ist. Dann wandert sie rüber. Daneben gedrückt: kurz gesperrt, der Zeiger wird schneller.</div>
      <div class="bombrow"><div class="bomb" id="bomb">💣</div></div>
      <div class="sub" id="bh"></div>
      <div class="bbar"><i class="bzone" id="bz"></i><i class="bptr" id="bp" data-v=""></i></div>
      <div class="sub" id="bs">&nbsp;</div></div>`);
    const bomb = $('#bomb'), bh = $('#bh'), bz = $('#bz'), bp = $('#bp'), bs = $('#bs');
    // Der Zeiger läuft auf einer Zickzack-Bahn: ab Zeitpunkt t von Stelle u (0 bis 2, ab 1 geht es zurück) mit Tempo v.
    // Daraus rechnen Gastgeber und Online-Gast dieselbe Position, und ein verspäteter Druck zählt an der Stelle von damals.
    let seg = {t: t0, u: 0, v: speed};
    const segAt = t => { const u = ((seg.u + seg.v*Math.max(0, t - seg.t)/1000) % 2 + 2) % 2; return u <= 1 ? [u, 1] : [2 - u, -1]; };
    const setSeg = t => { const [x, d] = segAt(t); seg = {t, u: d > 0 ? x : 2 - x, v: speed + pen}; bp.dataset.seg = `${Math.round(t*10)/10} ${seg.u.toFixed(5)} ${seg.v.toFixed(4)}`; };
    setSeg(t0);
    const showHolder = () => {
      bh.innerHTML = `${nm(holder)} hat die Bombe`;
      bomb.style.left = holder === 0 ? '22%' : '78%';
      bz.style.left = zone[0]*100 + '%'; bz.style.width = (zone[1]-zone[0])*100 + '%';
    };
    showHolder();
    cur = { buzz: p => {
      if (over || p !== holder) return;
      const now = inT();
      if (now < seg.t || now < lockUntil || now - t0 >= fuse) return;
      const [pos] = segAt(now);
      if (pos >= zone[0] && pos <= zone[1]) { holder = 1-holder; newZone(); speed = Math.min(2.6, speed + .12); pen = 0; setSeg(now); bp.classList.remove('fast'); Snd.buzz(p); bs.textContent = 'Weitergegeben!'; showHolder(); }
      else { lockUntil = now + 450; pen = Math.min(BOMB_PEN_MAX, pen + BOMB_PEN); setSeg(now); bp.classList.add('fast'); Snd.bad(); bs.textContent = `${P[p].name}: daneben, kurz gesperrt, der Zeiger wird schneller.`; }
    }};
    let lastTick = 0;
    const boom = () => {
      over = true; cur = null;
      bomb.textContent = '💥'; bomb.classList.add('boom'); Snd.crash();
      const w = 1-holder; if (subpt(w)) s[w]++;
      bs.innerHTML = `Boom! ${nm(holder)} hatte die Bombe, ${ptFor(w)}.`;
      after(s, LEN.bomb, done, round, 2000);
    };
    const loop = () => {
      if (over) return;
      const now = performance.now();
      const [pos, dir] = segAt(now);
      bp.style.left = pos*100 + '%';
      if (isBot(holder)) {
        if (botAt == null && now >= lockUntil) {
          const [sd, react] = bv(BOTP.bomb), c = (zone[0] + zone[1])/2, v = speed + pen;
          let x = pos, d = dir, tt = 0;
          while (tt < 4) { x += d*v*.005; if (x > 1) { x = 1; d = -1; } if (x < 0) { x = 0; d = 1; } tt += .005; if (tt >= react && Math.abs(x - c) < .015) break; }
          botAt = now + Math.max(.05, tt + gauss()*sd)*1000;
        } else if (botAt != null && now >= botAt) { botAt = null; buzz(1); }
      } else botAt = null;
      const el = now - t0, iv = Math.max(110, Math.min(700, (fuse - el)/8));
      if (now - lastTick > iv) { lastTick = now; Snd.tick(); bomb.classList.toggle('pulse'); }
      // Hält der Online-Gast die Bombe, kann sein rettender Druck noch unterwegs sein: kurz abwarten
      if (el >= fuse && (!isRemote(holder) || el >= fuse + holdMs())) return boom();
      frame(loop);
    };
    frame(loop);
  }
  round();
}

/* ---------- Auktion ---------- */
function auktion(done){
  const s = G.start.slice(), money = [100,100], bid = [0,0];
  const ITEMS = ['Neon-Katana','Enterhaken','Raketenstiefel','Glitch-Chip','Holo-Maske','Cyber-Arm','Drohnen-Schwarm','Nachtsicht-Visier','Chrom-Herz','Daten-Kristall','Tarnumhang','Plasma-Seil'];
  let r = 0, first = 0, item = '';
  const budget = () => `${esc(P[0].name)} ${money[0]}, ${esc(P[1].name)} ${money[1]}`;
  function startRound(){
    item = pickOne(ITEMS); first = nextStarter();
    if (money[0] === 0 && money[1] === 0) { money[0] = money[1] = 20; }
    ask(first);
  }
  function ask(p){
    cur = null; pads(false);
    const firstTurn = p === first;
    view(`<div class="card cut"><div class="kick">Auktion ${r+1}: ${esc(item)}. ${esc(P[p].name)} bietet${firstTurn ? `, ${esc(P[1-p].name)} schaut weg` : ', das erste Gebot ist schon gesperrt'}</div>
      <h2 class="q">Dein Budget: ${money[p]}</h2>
      <input class="ansin" id="ai" type="text" inputmode="numeric" autocomplete="off" placeholder="0 bis ${money[p]}"><br>
      <button class="btn" id="ok">Gebot abgeben</button>
      <p class="hint">Wer mehr bietet, gewinnt die Runde und zahlt sein Gebot, der andere zahlt nichts. Das Budget gilt für das ganze Spiel. Budget: ${budget()}</p></div>`);
    const inp = $('#ai'), bot = isBot(p), remote = isRemote(p);
    if (remote) { inp.readOnly = true; inp.dataset.net = 'in'; inp.placeholder = `⌨️ ${P[p].name} bietet …`; $('#ok').dataset.net = 'ok'; $('#ok').style.display = 'none'; }
    else if (!bot) inp.focus();
    const submit = () => {
      const v = parseNum(inp.value);
      if (isNaN(v) || v < 0 || v > money[p] || v !== Math.floor(v)) { inp.value = ''; inp.focus(); return; }
      bid[p] = v;
      if (firstTurn) ask(1-first); else reveal();
    };
    $('#ok').onclick = submit;
    if (bot) { inp.readOnly = true; inp.placeholder = '🤖 überlegt …'; $('#ok').style.display = 'none'; later(() => { if (inp.isConnected) { inp.value = String(botBid(money, s)); submit(); } }, brnd(1200, 2400)); }
    else if (remote) NET.text = v => { const n = parseNum(v); if (!inp.isConnected || isNaN(n) || n < 0 || n > money[p] || n !== Math.floor(n)) return false; inp.value = v; submit(); return true; };
    else inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  }
  function reveal(){
    const w = bid[0] > bid[1] ? 0 : bid[1] > bid[0] ? 1 : -1;
    let msg;
    if (w >= 0) { money[w] -= bid[w]; if (subpt(w)) s[w]++; r++; msg = `${nm(w)} ersteigert ${esc(item)} für ${bid[w]}.${zcTail(w)}`; }
    else msg = 'Gleich hohe Gebote, niemand zahlt, die Runde zählt nicht.';
    const fin = w >= 0 && s[w] >= LEN.auk;
    view(`<div class="card cut"><div class="kick">Gebote aufgedeckt</div>
      <div class="reveal"><div><b>${bid[0]}</b>${esc(P[0].name)}</div><div><b>${bid[1]}</b>${esc(P[1].name)}</div></div>

}

  seg('bsel', b => setBot(true, +b.dataset.v));
  $('#rst').onclick = () => { used = {}; saveUsed(); $('#rst').textContent = 'Zurückgesetzt'; };
  info();
}

const LENSEL = {};
const LNAMES = ['Kurz','Normal','Lang'];
const fmtFor = need => `Best of ${need*2-1}: wer zuerst ${need} hat, gewinnt.`;

/* ---------- Powerups ---------- */
const PU = {
  double:{icon:'⚔️', name:'Doppelschlag', short:'Doppel', desc:'Gewinnst du das Spiel, zählt es doppelt. Nicht im Finale.'},
  lead:{icon:'🚀', name:'Vorsprung', short:'Vorsprung', desc:'Du startest das Spiel mit einem Punkt. Nicht bei Best of 1.'},
  second:{icon:'❤️', name:'Zweite Chance', short:'2. Chance', desc:'Der erste Punkt, den du im Spiel abgibst, zählt nicht.'},
  konter:{icon:'🚫', name:'Konter', short:'Konter', desc:'Hebt das Powerup auf, das der Gegner gleichzeitig einsetzt.'},
  steal:{icon:'🦝', name:'Diebstahl', short:'Diebstahl', desc:'Gewinnst du das Spiel, klaust du ein zufälliges Powerup des Gegners.'},
};
const PU_KEYS = Object.keys(PU), MAXINV = 4;
function grant(p){ if (P[p].inv.length >= MAXINV) return null; const k = pickOne(PU_KEYS); P[p].inv.push(k); return k; }
// Etagen mit Belohnung: nach einem und zwei Dritteln des Wegs zum Dach
// Comeback „Doppelt oder nichts“: ab 2 Punkten Rückstand, bei langen Duellen ab 3
const cbThreshold = () => isEndless() || rounds >= 11 ? 3 : 2;
const puNeeded = fin => !!(P[0].inv.length || P[1].inv.length || (!fin && (P[0].cb === 'ready' || P[1].cb === 'ready')));
function milestones(){ if (!MODE.pu) return []; if (isEndless()) return Array.from({length:100}, (_, k) => 3*(k+1)); return [...new Set([Math.ceil(MAJ/3), Math.ceil(2*MAJ/3)])].filter(x => x >= 1 && x < MAJ); }
// Uneinholbar = selbst wenn der Hintere jede restliche Runde gewinnt, das Finale doppelt zählt
// und er in jeder weiteren Runde einen Doppelschlag hätte, kommt er nicht mehr ran (Gleichstand zählt als einholbar).
function maxCatchUp(T){
  let max = 0;
  for (let r = ri; r < rounds; r++) {
    const fin = MODE.kind === 'classic' && rounds > 1 && r === rounds - 1;
    const dbl = MODE.pu && !fin && (r > ri || P[T].inv.includes('double') || P[T].cb === 'ready');
    max += isLate() ? (r + 1) + (dbl ? 1 : 0) : (fin ? 2 : 1) * (dbl ? 2 : 1);
  }
  return max;
}
function uneinholbar(){
  if (isEndless() || ri >= rounds || P[0].score === P[1].score) return false;
  const L = P[0].score > P[1].score ? 0 : 1, T = 1 - L;
  return P[L].score > P[T].score + maxCatchUp(T);
}
function toast(msg){
  let el = $('#toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; re(el, 'on');
}

  const c = d.ctl, box = (p, inner) => `<div class="${p ? 'r' : 'l'}"><small class="c${p+1}">${esc(P[p].name)}</small>${isBot(p) ? '<span class="kl">🤖 spielt automatisch</span>' : inner}</div>`;
  let h;
  if (c.t === 'buzz') h = [0,1].map(p => box(p, `<span class="kl">${kb(p ? 'L' : 'A')} ${c.v || ''}</span>`)).join('');
  else if (c.t === 'row') h = [0,1].map(p => box(p, ROWS[p].slice(0, c.n).map((k, i) => `<span class="kl">${kb(k)}${c.lab && c.lab[i] ? ' ' + c.lab[i] : ''}</span>`).join(''))).join('');
  else if (c.t === 'type') h = [0,1].map(p => box(p, `<span class="kl">${kb(p ? 'L' : 'A')} buzzern, dann tippen</span>`)).join('');
  else if (c.t === 'input') h = `<div class="w"><span class="kl">Nacheinander eintippen, mit ${kb('Enter')} bestätigen</span></div>`;
  else h = `<div class="w"><span class="kl">Karten anklicken oder antippen</span></div>`;
  const notes = [c.note, c.t === 'type' && !TOUCH ? `Antwort mit ${kb('Enter')} bestätigen.` : '', TOUCH && c.t !== 'mouse' && c.t !== 'input' ? 'Am Touchscreen tippt jeder auf seiner Seite.' : ''].filter(Boolean);
  return `<div class="ctl">${h}</div>${notes.length ? `<p class="ctlnote">${notes.join(' ')}</p>` : ''}`;
}

/* ---------- Powerups an den Figuren ----------
   Vor jedem Spiel wählen beide verdeckt direkt an ihrer Figur: links Q W E R (keins T), rechts Z U I O (keins P) oder antippen.
   Wer das Comeback bereit hat, entscheidet danach, ob er „Doppelt oder nichts“ zündet (erste Taste ja, zweite nein). */
const CB_DESC = 'Nur für den, der hinten liegt, einmal pro Rückstand. Gewinnst du das Spiel, zählt es doppelt, verlierst du, zählt der Sieg des Gegners doppelt. Nicht im Finale, stapelt nicht mit dem Doppelschlag.';
let PBS = null, pbRev = [null, null], pbRevT = null;
const pbUsable = (k, need) => !(k === 'double' && PBS && PBS.finale) && !(k === 'lead' && need < 2);
const pbCbOk = i => !!(PBS && !PBS.finale && P[i].cb === 'ready');
// 0 = keine Wahl, 1 = Powerup wählen, 2 = Comeback entscheiden, 3 = fertig gewählt
const pbStage = i => !PBS || !PBS.active || PBS.paused ? 0 : PBS.ch[i] === undefined ? 1 : (pbCbOk(i) && PBS.cbc[i] === undefined ? 2 : 3);
const pbReady = () => pbStage(0) === 3 && pbStage(1) === 3;
const pbChanged = () => { if (PBS && PBS.onChange) PBS.onChange(); };
function pbBegin(finale){ PBS = {ch:[undefined, undefined], cbc:[undefined, undefined], finale, need:3, active:true, paused:false, onChange:null}; pbRev = [null, null]; clearTimeout(pbRevT); }
function pbSetNeed(need){

  PBS.need = need;

  [0,1].forEach(i => { const j = PBS.ch[i]; if (j != null && !pbUsable(P[i].inv[j], need)) { PBS.ch[i] = undefined; PBS.cbc[i] = undefined; toast(`${P[i].name}: ${PU.lead.icon} Vorsprung geht bei Best of 1 nicht, bitte neu wählen`); } });
  [0,1].forEach(renderPB); pbChanged();
}
function pbPick(i, j){
  if (pbStage(i) !== 1) return;
  if (j >= 0) { const k = P[i].inv[j]; if (!k || !pbUsable(k, PBS.need)) return; PBS.ch[i] = j; } else PBS.ch[i] = null;
  Snd.buzz(i); renderPB(i); pbChanged();
}
function pbComeback(i, yes){ if (pbStage(i) !== 2) return; PBS.cbc[i] = yes; Snd.buzz(i); renderPB(i); pbChanged(); }
// Tastenreihe: 1. bis 4. Taste = Powerup 1 bis 4, 5. Taste = keins. Beim Comeback: 1. Taste zünden, 2. Taste nicht.
function pbRow(p, i){ const st = pbStage(p); if (st === 1) pbPick(p, i === 4 ? -1 : i); else if (st === 2 && i < 2) pbComeback(p, i === 0); }
// Beim Start aufdecken und anwenden
function pbFinalize(){
  const pick = [0,1].map(p => PBS.ch[p] == null ? null : P[p].inv[PBS.ch[p]]);
  [0,1].forEach(p => { if (PBS.ch[p] != null) P[p].inv.splice(PBS.ch[p], 1); });
  const eff = [0,1].map(p => pick[p] && pick[p] !== 'konter' && pick[1-p] !== 'konter' ? pick[p] : null);
  const rv = [0,1].map(p => {
    if (!pick[p]) return {icon:'–', txt:'kein Powerup'};
    if (pick[p] === 'konter') return {icon:PU.konter.icon, txt: pick[1-p] ? `Konter hebt ${PU[pick[1-p]].icon} ${PU[pick[1-p]].name} auf` : 'Konter geht ins Leere'};
    return {icon:PU[pick[p]].icon, txt: PU[pick[p]].name + (eff[p] ? '' : ', gekontert')};
  });
  cbActive = -1;
  [0,1].forEach(p => { if (PBS.cbc[p] && pbCbOk(p)) { cbActive = p; P[p].cb = 'used'; } });
  if (cbActive >= 0 && eff[cbActive] === 'double') { eff[cbActive] = null; P[cbActive].inv.push('double'); rv[cbActive].txt = 'Doppelschlag zurück ins Inventar, er stapelt nicht mit dem Comeback'; }
  if (cbActive >= 0) rv[cbActive].cb = true;
  pu = eff;
  G.start = [0,1].map(p => eff[p] === 'lead' ? 1 : 0);
  G.shield = [0,1].map(p => eff[p] === 'second');
  PBS.active = false;

}
function pbReveal(rv){
  pbRev = rv; [0,1].forEach(renderPB); Snd.go();

function nextPU(i){
  const th = milestones();
  if (P[i].ms >= th.length) return null;
  return th[P[i].ms];
}
const pbActive = i => {
  const used = pu[i] === 'second' && !G.shield[i];
  const long = [pu[i] ? `aktiv: ${PU[pu[i]].icon} ${PU[pu[i]].name}${used ? ' (verbraucht)' : ''}` : '', cbActive === i ? '🔥 Doppelt oder nichts' : ''].filter(Boolean).join('<br>');
  const short = [pu[i] ? PU[pu[i]].icon + (used ? '✓' : '') : '', cbActive === i ? '🔥' : ''].join('');

};
function renderPB(i){

  } else if (st === 2) {
    cls = ' sel';
    body = `<div class="pbt">🔥 Doppelt oder nichts zünden?</div><div class="pbl"><button class="pbb" data-c="1" title="${esc(CB_DESC)}"><span>🔥</span><b class="nm">zünden</b><b class="sn">zünden</b>${kb(kl(i, 0))}</button><button class="pbb" data-c="0" title="Diesmal nicht"><span>–</span><b class="nm">nicht</b><b class="sn">nicht</b>${kb(kl(i, 1))}</button></div>`;

  }

}

function single(d){

let played = [], MAJ = 4, pool = [], lastCat = null, lastLoser = -1;
function startMatch(){
  P.forEach(p => { p.score = 0; p.inv = MODE.pu ? shuffle(PU_KEYS.slice()).slice(0, 2) : []; p.ms = 0; p.cb = 'none'; });
  order = []; pool = []; lastCat = null; lastLoser = -1; curFinale = false; pu = [null,null]; cbActive = -1;
  ri = 0; stechen = false; mode = 'match'; resetStats();
  played = []; MAJ = majFor(); starter = R0(2);
  document.body.classList.remove('single'); document.body.classList.add('match'); document.body.classList.toggle('pu', MODE.pu);
  climb.reset();
  nextRound();
}
const chooserNow = () => P[0].score !== P[1].score ? (P[0].score < P[1].score ? 0 : 1) : lastLoser;
function draftOptions(){
  const on = DISC.filter(isOn), prev = order[order.length-1];
  if (!pool.length) pool = on.slice();
  let cand = pool.filter(d => d !== prev);
  if (cand.length < 3) cand = cand.concat(shuffle(on.filter(d => !cand.includes(d) && d !== prev)));
  if (!cand.length) cand = on.slice();
  const byCat = {};
  shuffle(cand.slice()).forEach(d => { (byCat[d.cat] = byCat[d.cat] || []).push(d); });
  const cats = shuffle(Object.keys(byCat)).sort((a,b) => (a === lastCat) - (b === lastCat));
  const out = cats.slice(0,3).map(c => byCat[c][0]);
  for (const d of shuffle(cand.slice())) { if (out.length >= 3) break; if (!out.includes(d)) out.push(d); }
  return out;
}
function nextRound(){
  if (!isEndless() && ri >= rounds) return finish();

  const finale = MODE.kind === 'classic' && rounds > 1 && ri === rounds - 1;
  const opts = draftOptions();
  if (opts.length === 1) return startRound(opts[0], finale);
  const c = chooserNow(), chooser = c >= 0 ? c : R0(2);
  cur = null; pads(false); G.active = false; updateHud();
  view(`<div class="card cut"><div class="kick">${finale ? `Finale, ${roundLabel()}` : roundLabel() + valTxt()}</div>
    <h2 class="who">${nm(chooser)} wählt ${finale ? 'das Finalspiel' : 'das nächste Spiel'}</h2>
    <p class="hint">${P[0].score !== P[1].score ? 'Wer zurückliegt, wählt.' : c >= 0 ? 'Gleichstand: wer die letzte Runde verloren hat, wählt.' : 'Zum Start ausgelost.'}${finale ? ' Das Finale zählt doppelt.' : ''}</p>
    <div class="choices">${opts.map((d,i) => `<button class="choice" data-i="${i}"><span class="ti">${d.icon}</span><b>${d.name}</b><small>${d.cat}</small><em>${kb(kl(chooser, i))}</em></button>`).join('')}</div></div>`);
  let taken = false;
  const pick = i => { if (taken || !opts[i]) return; taken = true; cur = null; startRound(opts[i], finale); };
  main.querySelectorAll('.choice').forEach(b => b.onclick = () => { if (mayAct(chooser)) pick(+b.dataset.i); });
  cur = { row: (p, i) => { if (p === chooser && i < opts.length) pick(i); } };
  if (isBot(chooser)) later(() => pick(R0(opts.length)), brnd(1300, 2300));
}
function startRound(d, finale){
  order.push(d); pool = pool.filter(x => x !== d); lastCat = d.cat; curFinale = finale;
  PBS = null; if (puNeeded(finale)) pbBegin(finale);
  intro(d, () => { updateHud(); d.play(roundDone); }, finale ? {finale: true, len: 2} : {});
}

function roundDone(w, sc){
  cur = null; pads(false); G.active = false;
  let pts = 0, line;
  const d = order[ri], notes = [];
  if (w >= 0) {
    const before = P[w].score - P[1-w].score;
    const boost = pu[w] === 'double' || cbActive >= 0;
    pts = isLate() ? (ri + 1) + (boost ? 1 : 0) : (curFinale ? 2 : 1) * (boost ? 2 : 1);
    P[w].score += pts; lastLoser = 1-w;
    // Endlos: das Dach wandert mit, beide Figuren rücken ohne Animation nach
    if (isEndless() && P[w].score > MAJ - 2) { MAJ = P[w].score + 6; [0,1].forEach(i => { climb.p[i] = (P[i].score - (i === w ? pts : 0))/MAJ; }); climb.relayout(); }
    const diff = P[w].score - P[1-w].score;
    line = curFinale ? pickOne(LINES.finale) : cbActive >= 0 ? pickOne(w === cbActive ? LINES.cbWin : LINES.cbLose) : pu[w] === 'double' ? pickOne(LINES.double) : (before < 0 && diff === 0) ? pickOne(LINES.tie) : before < 0 ? pickOne(LINES.comeback) : diff >= 3 ? pickOne(LINES.lead) : pickOne(LINES.hit);
    climb.to(w, P[w].score/MAJ, pts > 1); climb.shout(line, w);
    if (cbActive >= 0) notes.push(w === cbActive ? `🔥 Doppelt oder nichts geglückt: ${nm(w)} holt ${pts} Punkte.` : `🔥 Doppelt oder nichts ging schief: der Sieg von ${nm(w)} zählt ${isLate() ? 'einen Punkt mehr' : 'doppelt'}.`);
    if (pu[w] === 'double' && cbActive >= 0) notes.push(`${PU.double.icon} Doppelschlag und Comeback stapeln nicht, es bleibt bei ${isLate() ? 'einem Punkt extra' : 'doppelt'}.`);
    if (pu[w] === 'steal') {
      if (P[1-w].inv.length && P[w].inv.length < MAXINV) { const k = P[1-w].inv.splice(R0(P[1-w].inv.length), 1)[0]; P[w].inv.push(k); notes.push(`${PU.steal.icon} ${nm(w)} klaut ${PU[k].icon} ${PU[k].name} von ${nm(1-w)}.`); }
      else notes.push(`${PU.steal.icon} Der Diebstahl von ${nm(w)} geht leer aus.`);
    }
    [0,1].forEach(i => { if (pu[i] === 'double' && i !== w) notes.push(`${PU.double.icon} Der Doppelschlag von ${nm(i)} verpufft.`); });
  } else {
    line = pickOne(LINES.draw); climb.shout(line, -1);
  }
  // Belohnungen: Etagen, dazu der Comeback-Status
  const th = milestones(), rewards = [];
  [0,1].forEach(i => {
    const got = [];
    while (P[i].ms < th.length && P[i].score >= th[P[i].ms]) {
      P[i].ms++; const k = grant(i); got.push(k);
      rewards.push(k ? `${nm(i)} landet auf einem Geschenk-Dach und bekommt ${PU[k].icon} <b>${PU[k].name}</b>.` : `${nm(i)} landet auf einem Geschenk-Dach, das Inventar ist aber voll (höchstens ${MAXINV}).`);
    }
    if (got.length) later(() => climb.gift(i, got), 1300);
    // Comeback: bereit ab Rückstand, nach dem Einsatz erst wieder, wenn man zwischendurch unter die Schwelle kam
    const deficit = P[1-i].score - P[i].score;
    if (MODE.pu && deficit >= cbThreshold()) { if (P[i].cb === 'none') { P[i].cb = 'ready'; notes.push(`🔥 Comeback bereit für ${nm(i)}: vor einem der nächsten Spiele (nicht im Finale) kann „Doppelt oder nichts“ gezündet werden.`); } }
    else P[i].cb = 'none';
  });
  played.push({d, w, sc, pts, pu: pu.slice(), cb: cbActive});
  ri++; updateHud();
  const early = uneinholbar();
  let nxt = '';
  if (early) { const L = P[0].score > P[1].score ? 0 : 1; nxt = `<p><b>${nm(L)} ist nicht mehr einzuholen.</b> Selbst mit Sieg${MODE.pu ? ' und Doppelschlag' : ''} in jeder restlichen Runde reicht es für ${nm(1-L)} nicht mehr, das Duell endet vorzeitig.</p>`; }
  else if (isEndless() || ri < rounds) {
    const c = chooserNow();
    const np = [0,1].map(i => { const x = nextPU(i); return x == null ? `${nm(i)} hat alle` : `${nm(i)} bei ${x} Punkten`; });
    nxt = `${MODE.pu ? `<p class="hint">🎁 Nächstes Geschenk-Dach: ${np.join(', ')}.</p>` : ''}<p class="hint">Als Nächstes wählt ${c >= 0 ? nm(c) : 'das Los'}${MODE.kind === 'classic' && ri === rounds - 1 ? ' das Finalspiel' : ''}${isLate() ? `, Runde ${ri+1} zählt ${ri+1} Punkte` : ''}.</p>`;
  }
  view(`<div class="card cut"><div class="kick">${isEndless() ? `${ri} gespielt` : `${ri} von ${rounds} gespielt`}${curFinale ? ', Finale' : ''}</div>
    <h1 class="big-h">${w >= 0 ? nm(w) + (pts > 1 ? ` holt ${pts} Punkte` : ' holt den Punkt') : 'Kein Punkt'}</h1>
    <p>${esc(line)}</p>
    ${rewards.length ? `<div class="reward"><div class="kick">🎁 Geschenk-Dach</div>${rewards.map(n => `<p>${n}</p>`).join('')}</div>` : ''}
    ${notes.length ? `<div class="pures">${notes.map(n => `<p>${n}</p>`).join('')}</div>` : ''}
    ${sc ? `<p class="hint">${d.icon} ${esc(d.name)}: ${sub(sc)}</p>` : ''}
    ${highlights(gstats, 'Spiel-Statistik')}
    <p>Gesamtstand: ${sub([P[0].score, P[1].score])}</p>${nxt}
    <button class="btn" id="nx">${early || (!isEndless() && ri >= rounds) ? 'Zum Ergebnis' : 'Weiter'}</button>${isEndless() ? '<br><button class="btn ghost" id="endd">Duell beenden</button>' : ''}</div>`);
  $('#nx').onclick = () => { if (early) ri = rounds; nextRound(); };
  const ed = $('#endd'); if (ed) ed.onclick = finish;
}

function finish(){
  cur = null; pads(false);

    stechen = true; pu = [null,null]; PBS = null;
    const d = {...DISC[0], rule: () => 'Eine einzige Runde Reaktion entscheidet das Duell. Grün abwarten, Gelb ignorieren.'};

function highlights(o, title = 'Highlights'){

const NET_BUILD = 'v21';
const NET = {on:false, role:'', code:'', peer:null, conn:null, open:false, from:0, scr:0, mid:0, ping:0, hostPing:0, rtts:[], lastRx:0,
  text:null, tok:'', saved:null, mirror:false, html:null, lastScr:-1, lastMain:null, lastG:'', lastL:'', pbLast:['',''], ck:{}, ckid:0,
  sp:null, spT:0, spLabel:'', spRaf:0, mute:false, rlT:0, rlN:0, fixed:new WeakSet(), lobby:null, myName:'', myAv:null, tries:0,
  tickT:0, watchT:0, retryT:0, lostT:0, joinT:0, loading:null, guestTok:'', joinCode:'', ovState:'', toastLocal:null, lastMode:'', needT:0,
  // Zeitausgleich
  off:0, offOk:false, offS:[], dispH:0, dispG:0, mutT:0, flushQ:false, mo:null, mch:null, hold:150, lags:[], vt:null, seq:[], seqT:0, lrP:[], lrY:0, graf:0, testLag:0, noEv:false, za:'', zaG:0, offT:0};
/* =====================================================================
   ONLINE: zwei Geräte, eine Partie.
   Der Gastgeber (Spieler 1) rechnet das ganze Spiel wie bisher. Der Gast (Spieler 2)
   bekommt eine Kopie des Spielfelds und schickt nur seine Eingaben zurück.
   Die Verbindung läuft direkt zwischen den Geräten (WebRTC über PeerJS).
   ===================================================================== */
const NET_PREFIX = 'duelldd-', NET_ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const NET_SITE = 'https://tabiuseheo.github.io/duell/';   // Adresse der Webseite, für den Hinweis in Kopien ohne Online-Funktion
const isRemote = p => NET.on && NET.role === 'host' && p === 1;
// Darf diese Eingabe für Spieler p zählen? Offline wie bisher, online nur die eigene Seite
const mayAct = p => !isBot(p) && (!NET.on || NET.role !== 'host' || NET.from === p);
const netCode = () => { const a = new Uint32Array(4); (window.crypto || {getRandomValues: x => x.map(() => Math.random()*1e9)}).getRandomValues(a); return [...a].map(v => NET_ABC[v % NET_ABC.length]).join(''); };
const netCodeOk = c => new RegExp(`^[${NET_ABC}]{4}$`).test(c);
const netLink = c => location.origin + location.pathname + '#' + c;

/* ---------- Zeitausgleich ----------
   Der Gast sieht alles etwas später, und seine Eingaben kommen später an. Darum zählt beim Gastgeber nicht die Ankunft,
   sondern der Moment, in dem der Gast gedrückt hat. Jede Eingabe des Gasts trägt zwei Zeitstempel (Uhr des Gastgebers):
   - vt: der Zeitpunkt des Bildes, das der Gast beim Drücken vor sich hatte (für alles, was er im gespiegelten Bild sieht)
   - ct: die echte Uhrzeit beim Drücken (für das, was der Gast selbst nach der gemeinsamen Uhr zeichnet: Bombenzeiger, Noten, Sprint)
   Wo es auf „wer zuerst“ oder auf eine Frist ankommt, wartet der Gastgeber kurz (NET.hold), bis verspätete Eingaben da sein können. */
function holdMs(){ return NET.on && NET.role === 'host' && NET.open ? NET.hold : 0; }
function inT(){ return NET.vt != null ? NET.vt : performance.now(); }
function netHoldCalc(){
  const r = NET.rtts.length ? Math.max(...NET.rtts) : 150, l = NET.lags.length ? Math.max(...NET.lags) : 0;
  NET.hold = Math.round(clamp(Math.max(r + 45, l + 25), 50, 450));
}
// Eingaben, bei denen es um „wer zuerst“ geht: nach Zeit sortiert, jede hold ms nach dem Drücken
function netSeq(p, c){
  NET.seq.push({p, t: inT(), c, g: gen});
  NET.seq.sort((a, b) => a.t - b.t);
  netSeqRun();
}
function netSeqRun(){
  clearTimeout(NET.seqT); NET.seqT = 0;
  const H = holdMs();
  while (NET.seq.length && NET.seq[0].t + H <= performance.now()) {
    const e = NET.seq.shift();
    if (e.g !== gen || !cur || cur !== e.c || !cur.buzz) continue;
    NET.vt = e.t;
    try { cur.buzz(e.p); } finally { NET.vt = null; }
  }
  if (NET.seq.length) NET.seqT = setTimeout(netSeqRun, Math.max(0, NET.seq[0].t + H - performance.now()) + 1);
}
// Ton nur hier abspielen, nicht an den Gast schicken (der spielt ihn selbst zur richtigen Zeit)
function sndLocal(fn){ NET.noEv = true; try { fn(); } finally { NET.noEv = false; } }
// Uhrabgleich (Gast): Uhr des Gastgebers = eigene Uhr + NET.off. Von den letzten Messungen zählt die mit der kürzesten Laufzeit.
// Nach den ersten Messungen wird nur noch langsam nachgeführt (höchstens etwa 2 ms pro Sekunde): bewegte Teile springen nicht,
// und weil Bild und Zeitstempel des Gasts dieselbe Uhr nutzen, stört ein kleiner Rest-Fehler die Wertung nicht.
function netClock(m){
  const now = performance.now(), rtt = now - m.a;
  if (!Number.isFinite(m.a) || !Number.isFinite(m.h) || rtt < 0 || rtt > 5000) return;
  NET.offS.push({rtt, off: m.h - (m.a + now)/2});
  if (NET.offS.length > 16) NET.offS.shift();
  let b = NET.offS[0]; for (const x of NET.offS) if (x.rtt < b.rtt) b = x;
  if (!NET.offOk || NET.offS.length < 5) NET.off = b.off;
  else { const lim = (now - NET.offT)*.002 + .5; NET.off += clamp(b.off - NET.off, -lim, lim); }
  NET.offOk = true; NET.offT = now;
}
// Zeit des Gastgebers, wie der Gast sie im Bild sieht (tP) und wie sie wirklich ist (tS)
const netTP = now => NET.dispG ? now + NET.dispH - NET.dispG : now + NET.off;
const netTS = now => NET.offOk ? now + NET.off : netTP(now);
function netDisp(hs){ if (Number.isFinite(hs)) { NET.dispH = hs; NET.dispG = performance.now(); } }
// Eingabe des Gasts mit beiden Zeitstempeln losschicken
function netIn(o){
  const now = performance.now();
  o.t = 'in';
  const za = NET.za ? +NET.za : NaN;
  if (Number.isFinite(za)) o.vt = Math.round((za + now - NET.zaG)*10)/10;
  else if (NET.dispG) o.vt = Math.round(netTP(now)*10)/10;
  if (NET.offOk) o.ct = Math.round((now + NET.off)*10)/10;
  netSend(o);
  return o;
}
// Nur für Tests: künstliche Verzögerung beim Empfang (NET.testLag ms)
function netRx(c, d){
  if (NET.conn !== c) return;
  if (NET.testLag > 0) setTimeout(() => { if (NET.conn === c) netRecv(d); }, NET.testLag);
  else netRecv(d);
}

function netLoad(){
  if (window.Peer) return Promise.resolve();
  if (NET.loading) return NET.loading;
  return NET.loading = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'peerjs.min.js'; s.async = true;
    const fail = why => { clearTimeout(to); NET.loading = null; s.remove(); rej(new Error(why)); };
    const to = setTimeout(() => fail('timeout'), 12000);
    s.onload = () => { clearTimeout(to); window.Peer ? res() : fail('nopeer'); };
    s.onerror = () => fail('load');
    document.head.appendChild(s);
  });
}
// Nur für Tests: ?peer=localhost:9000 nutzt einen eigenen Signalserver
function netOpts(){
  const o = {debug: 0};
  const q = new URLSearchParams(location.search).get('peer');
  if (q && /^(localhost|127\.0\.0\.1):\d{2,5}$/.test(q)) { const [host, port] = q.split(':'); Object.assign(o, {host, port: +port, path: '/', secure: false}); }
  return o;
}

/* ---------- Senden und Empfangen (Text, große Nachrichten in Stücken) ---------- */
function netSend(o){
  const c = NET.conn; if (!c || !NET.open) return false;
  let s; try { s = JSON.stringify(o); } catch(e) { return false; }
  try {
    if (s.length > 8000) {
      const id = ++NET.ckid, n = Math.ceil(s.length/8000);
      for (let i = 0; i < n; i++) c.send(JSON.stringify({t:'ck', id, i, n, d: s.slice(i*8000, (i+1)*8000)}));
    } else c.send(s);
  } catch(e) { return false; }
  return true;
}
const netBusy = () => { const c = NET.conn; if (!c) return true; const dc = c.dataChannel; return (c.bufferSize || 0) > 20 || (dc && dc.bufferedAmount > 600000); };
function netRecv(raw){
  NET.lastRx = performance.now();
  if (typeof raw !== 'string' || raw.length > 20000) return;
  let m; try { m = JSON.parse(raw); } catch(e) { return; }
  if (!m || typeof m !== 'object') return;
  if (m.t === 'ck') {
    if (!Number.isInteger(m.id) || !Number.isInteger(m.i) || !Number.isInteger(m.n) || m.n > 60 || m.i < 0 || m.i >= m.n || typeof m.d !== 'string') return;
    const b = NET.ck[m.id] || (NET.ck[m.id] = {n: m.n, parts: [], got: 0});
    if (b.parts[m.i] == null) { b.parts[m.i] = m.d; b.got++; }
    if (b.got < b.n) return;
    delete NET.ck[m.id];
    try { m = JSON.parse(b.parts.join('')); } catch(e) { return; }
    if (!m || typeof m !== 'object') return;
  }
  if (m.t === 'pi') { netSend({t:'po', a: m.a}); return; }
  if (m.t === 'po') { if (Number.isFinite(m.a)) { NET.rtts.push(performance.now() - m.a); if (NET.rtts.length > 7) NET.rtts.shift(); NET.ping = Math.round([...NET.rtts].sort((x, y) => x - y)[NET.rtts.length >> 1]); netHoldCalc(); netBadge(); } return; }
  if (m.t === 'gp') { if (Number.isFinite(m.a)) netSend({t:'gq', a: m.a, h: performance.now()}); return; }
  if (m.t === 'gq') { netClock(m); return; }
  if (m.t === 'bye') { netEnd(NET.role === 'host' ? `${P[1].name} hat das Online-Spiel verlassen. Spieler 2 spielt jetzt wieder an diesem Gerät.` : `${P[0].name} hat das Online-Spiel beendet.`); return; }
  if (NET.role === 'host') netHostMsg(m); else netGuestMsg(m);
}

/* ---------- Verbindung ---------- */
function netBind(c){
  NET.conn = c;
  c.on('open', () => {
    if (NET.conn !== c) return;
    NET.open = true; NET.lastRx = performance.now();
    netSend({t:'hi', b: NET_BUILD, name: NET.on ? P[1].name : NET.myName, av: NET.on ? AV[1] : NET.myAv, tok: NET.tok});
  });
  c.on('data', d => netRx(c, d));
  c.on('close', () => { if (NET.conn === c) netLost(); });
  c.on('error', () => { if (NET.conn === c) netLost(); });
}
// Verbindung weg: der Gast versucht es selbst neu, der Gastgeber wartet
function netLost(){
  if (!NET.open && !NET.on) return;
  NET.open = false;
  try { NET.conn && NET.conn.close(); } catch(e) {}
  NET.conn = null;
  netSeqRun();   // ohne Verbindung wird nicht mehr gewartet: Wartende in der richtigen Reihenfolge abarbeiten
  if (!NET.on) { netOvMsg('Die Verbindung ist abgebrochen. Bitte nochmal versuchen.'); return; }
  netBadge();
  const who = NET.role === 'host' ? P[1].name : P[0].name;
  netBanner(`Verbindung zu ${who} unterbrochen, ${NET.role === 'host' ? 'warte' : 'verbinde neu'} …`);
  clearTimeout(NET.lostT);
  NET.lostT = setTimeout(() => { if (!NET.open) netEnd(`Die Verbindung zu ${who} ist weg.`); }, 45000);
  if (NET.role === 'guest') netRetry();
}
function netRetry(){
  clearTimeout(NET.retryT);
  if (!NET.on || NET.open || NET.role !== 'guest') return;
  const go = () => {
    if (!NET.peer || NET.peer.destroyed) return;
    if (NET.peer.disconnected) { try { NET.peer.reconnect(); } catch(e) {} }
    else netBind(NET.peer.connect(NET_PREFIX + NET.code, {reliable: true, serialization: 'raw'}));
    NET.retryT = setTimeout(() => { if (!NET.open) netRetry(); }, 3000);
  };
  NET.retryT = setTimeout(go, 1200);
}
// Lebenszeichen: jede Sekunde ein Ping (Gastgeber: Laufzeit, Gast: Uhrabgleich), nach 7 Sekunden Funkstille gilt die Verbindung als weg
function netWatch(){
  if (!NET.open) return;
  if (NET.role === 'host') netSend({t:'pi', a: performance.now()});
  else netSend({t:'gp', a: performance.now()});
  if (performance.now() - NET.lastRx > 7000) netLost();
}
function netStartTimers(){
  clearInterval(NET.watchT); NET.watchT = setInterval(netWatch, 1000);
  if (NET.role === 'host') { clearInterval(NET.tickT); NET.tickT = setInterval(netTick, 33); }
}
function netPeerErr(e){
  const t = e && e.type;
  if (t === 'unavailable-id' && NET.role === 'host' && !NET.on) { netNewRoom(++NET.tries); return; }
  if (t === 'peer-unavailable') { if (!NET.on) { netOvMsg('Raum nicht gefunden. Stimmt der Code, und ist der Raum noch offen?'); netOvState('join'); } return; }
  if (t === 'browser-incompatible') { netOvMsg('Dieser Browser kann keine direkten Verbindungen. Probier Chrome, Safari oder Firefox.'); return; }
  if (!NET.on) { netOvMsg('Keine Verbindung zum Server. Internet prüfen und nochmal versuchen.'); netOvState(NET.role === 'host' ? 'idle' : 'join'); }
}
function netNewPeer(id){
  try { if (NET.peer) NET.peer.destroy(); } catch(e) {}
  const p = id ? new Peer(id, netOpts()) : new Peer(netOpts());
  NET.peer = p;
  p.on('error', e => { if (NET.peer === p) netPeerErr(e); });
  p.on('disconnected', () => { if (NET.peer === p && !p.destroyed) setTimeout(() => { try { if (NET.peer === p && p.disconnected && !p.destroyed) p.reconnect(); } catch(e) {} }, 1500); });
  return p;
}

/* ---------- Raum erstellen (Gastgeber) ---------- */
function netHost(){
  NET.role = 'host'; NET.tries = 0;
  netOvState('wait-server');
  netLoad().then(() => netNewRoom(0), () => netNoLib());
}
function netNewRoom(tries){
  if (tries > 5) { netOvMsg('Kein freier Raum gefunden. Bitte nochmal versuchen.'); netOvState('idle'); return; }
  const code = netCode(), p = netNewPeer(NET_PREFIX + code);
  p.on('open', () => { if (NET.peer !== p) return; NET.code = code; netOvState('hosting'); });
  p.on('connection', c => { if (NET.peer === p) netCand(c); });
}
// Neue Verbindung beim Gastgeber: erst nach dem Hallo übernehmen. Derselbe Gast löst seinen alten Kanal ab,
// ein Fremder kommt nur rein, wenn der bisherige Gast schon eine Weile stumm ist.
function netCand(c){
  let ok = false;
  const bye = t => { try { c.send(JSON.stringify({t})); } catch(e) {} setTimeout(() => { try { c.close(); } catch(e) {} }, 400); };
  c.on('data', raw => {
    if (ok) { netRx(c, raw); return; }
    if (typeof raw !== 'string' || raw.length > 4000) return;
    let m; try { m = JSON.parse(raw); } catch(e) { return; }

    const ok = args.slice(0, 6).map(v => typeof v === 'number' && Number.isFinite(v) ? clamp(v, -5000, 5000) : ['square','sine','sawtooth','triangle'].includes(v) ? v : 0);
    if (f === 'tone' && (ok[1] > 3 || ok[3] > .2)) return;
    Snd[f](...ok);
  }
}
// Gast: bewegte Teile selbst zeichnen. Bombenzeiger und Noten nach der gemeinsamen Uhr, Zeitbalken passend zum Bild
function netGuestRaf(){
  NET.graf = 0;
  if (!NET.on || NET.role !== 'guest') return;
  NET.graf = requestAnimationFrame(netGuestRaf);
  if (!NET.mirror) return;
  const now = performance.now(), tS = netTS(now), tP = netTP(now);
  for (const el of main.querySelectorAll('[data-v]')) {
    const d = el.dataset;
    if (d.seg) {
      const [t0, u0, v] = d.seg.split(' ').map(Number);
      if (!Number.isFinite(t0) || !Number.isFinite(u0) || !Number.isFinite(v)) continue;
      const u = ((u0 + v*Math.max(0, tS - t0)/1000) % 2 + 2) % 2;
      el.style.left = (u <= 1 ? u : 2 - u)*100 + '%';
    } else if (d.bt) {
      const bt = +d.bt, tr = +d.tr || 1700; if (!Number.isFinite(bt)) continue;
      const f = 1 - (bt - tS)/tr;
      el.style.left = (12 + (1 - f)*88) + '%'; el.style.opacity = f < 0 ? 0 : 1;
      if (!el._tk && tS >= bt) { el._tk = 1; if (tS - bt < 120 && !el.classList.contains('gone')) Snd.tick(); }
    } else if (d.cd) {
      const [t0, full] = d.cd.split(' ').map(Number);
      if (!Number.isFinite(t0) || !(full > 0)) continue;
      el.style.width = clamp(100 - (tP - t0)/full*100, 0, 100) + '%';
      if (d.cc && /^(var\(--[\w-]+\)|#[0-9a-f]{3,8})$/i.test(d.cc)) el.style.background = d.cc;
    }
  }
  if (NET.sp && curDisc && curDisc.id === 'sprint') netSpDraw(tS);
}
// Neon-Sprint beim Gast: letzter Stand vom Gastgeber, bis jetzt weitergerechnet. Der eigene Läufer springt sofort beim Drücken.
function netSpDraw(tS){
  const S = NET.sp, cv = main.querySelector('#cv'); if (!S || !cv) return;
  const ctx = cv.getContext && cv.getContext('2d'); if (!ctx) return;
  const num = v => Number.isFinite(v) ? v : 0, arr = v => Array.isArray(v) ? v : [];
  const W = clamp(num(S.W), 200, 2000), H = clamp(num(S.H), 100, 600);
  const pw = (cv.parentElement && cv.parentElement.clientWidth) || W;
  const s = Math.min(pw/W, 1.15), cw = Math.round(W*s), ch = Math.round(H*s), dpr = Math.min(2, window.devicePixelRatio || 1);
  if (cv.style.width !== cw + 'px') { cv.style.width = cw + 'px'; cv.style.margin = '0 auto'; }
  if (cv.style.height !== ch + 'px') cv.style.height = ch + 'px';
  if (cv.width !== Math.round(cw*dpr) || cv.height !== Math.round(ch*dpr)) { cv.width = Math.round(cw*dpr); cv.height = Math.round(ch*dpr); }
  ctx.setTransform(dpr*s, 0, 0, dpr*s, 0, 0);
  const G = clamp(num(S.g), 100, 20000), JV = clamp(num(S.jv), 50, 5000), ht = num(S.ht);
  const live = !!S.st && !S.ov && !S.fz;
  const dt = live ? clamp((tS - ht)/1000, 0, .6) : 0;
  const sp = num(S.sp), ac = num(S.ac), dx = sp*dt + ac*dt*dt/2;
  const rn = [0,1].map(j => { const r = arr(S.rn)[j] || []; return {y: num(r[0]), vy: num(r[1]), dead: !!r[2], buf: num(r[3])}; });
  // Gegner: laufenden Sprungbogen weiterrechnen
  const arc = (y, vy, d) => { if (y <= 0 && vy <= 0) return 0; const yy = y + vy*d - G*d*d/2; return yy > 0 ? yy : 0; };
  // Eigener Läufer: Stand des Gastgebers plus eigene Sprünge, die er noch nicht kennt
  const ja = num(S.ja), dt1 = num(S.dt1), me = rn[1];
  NET.lrP = NET.lrP.filter(c => c > ja && c > tS - 2000);
  const sim = (y, vy, buf, from, to, ps) => {
    let ti = from, k = 0;
    for (let i = 0; ti < to && i < 120; i++) {
      const st = Math.min(to, ti + 8), h = (st - ti)/1000;
      while (k < ps.length && ps[k] <= st) buf = ps[k++];
      let hj = h;
      if (y === 0 && buf && st >= buf && st - buf < 150) { vy = JV; hj = Math.min(h, (st - buf)/1000); buf = 0; }
      if (y > 0 || vy > 0) { vy -= G*hj; y += vy*hj; if (y <= 0 && vy <= 0) { y = 0; vy = 0; } }
      ti = st;
    }
    return y;
  };
  let y1 = me.y, dead1 = me.dead;
  if (live) {
    if (me.dead) {
      // Crash beim Gastgeber, aber ein rettender Sprung ist noch unterwegs
      const rs = NET.lrP.filter(c => c <= dt1);
      if (rs.length) { dead1 = false; y1 = sim(me.y, 0, 0, rs[0], tS, rs); }
    } else y1 = sim(me.y, me.vy, me.buf, ht, tS, NET.lrP);
  }
  NET.lrY = y1;
  sprintPaint(ctx, {W, H, LH: num(S.LH), RX: num(S.RX), RW: num(S.RW), RH: num(S.RH), dist: num(S.d) + dx, speed: sp + ac*dt, v0: num(S.v0) || 1,
    started: !!S.st, over: !!S.ov, label: typeof S.lb === 'string' ? S.lb.slice(0, 40) : '', lsize: clamp(num(S.ls), 8, 80), t: num(S.tt) + dt,
    warn: arr(S.wa).map(num).slice(0, 2).concat([0,0]).slice(0, 2),
    obs: arr(S.o).slice(0, 80).map(o => ({x: num(o[0]) - dx, w: num(o[1]), h: num(o[2]), b: num(o[3]), fly: !!o[4], lane: o[5] === 0 || o[5] === 1 ? o[5] : null})),
    items: arr(S.it).slice(0, 30).map(it => ({x: num(it[0]) - dx, y: num(it[1]), taken: [!!it[2], !!it[3]]})),
    rn: [{y: rn[0].dead || !live ? rn[0].y : arc(rn[0].y, rn[0].vy, dt), dead: rn[0].dead}, {y: y1, dead: dead1}]});
}

/* ---------- Gast: Warteraum, solange der Gastgeber im Menü ist ---------- */
function netLobby(){
  NET.mirror = false; NET.html = null;
  pads(false);
  document.body.classList.remove('match','single','pu','pbinl');
  main.innerHTML = `<div class="card cut netlobby">
    <div class="kick">🌐 Online</div>
    <h2 class="who">Verbunden mit <span class="c1" id="nlh"></span></h2>
    <p class="hint" id="nlp"></p>
    <p><span class="c1" id="nlh2"></span> stellt das Duell ein und startet es. Du spielst rechts als <span class="c2">Spieler 2</span>.</p>
    <p class="hint" id="nls"></p>
    <div class="vs nlme"><input id="nlname" maxlength="14" placeholder="Dein Name" value="${esc(P[1].name === 'Spieler 2' ? '' : P[1].name)}"></div>
    <div class="avrow nlav"><button class="avbtn b" id="nlav"><span class="mini" data-i="1">${avatarSVG(1)}</span>Avatar</button></div>
    <button class="link" id="nlx">Online-Spiel verlassen</button></div>`;
  $('#nlname').addEventListener('input', e => { P[1].name = e.target.value.replace(/[\u0000-\u001f\u007f]/g, '').trim().slice(0, 14) || 'Spieler 2'; netSendProf(); });
  $('#nlav').onclick = () => openAvatar(1);
  $('#nlx').onclick = () => netEnd('Online-Spiel verlassen.');

}
function netLobbyInfo(){
  const h = $('#nlh'); if (!h) return;
  h.textContent = P[0].name; $('#nlh2').textContent = P[0].name;
  $('#nlp').textContent = NET.ping ? `Verzögerung etwa ${NET.ping} ms` : NET.hostPing ? `Verzögerung etwa ${NET.hostPing} ms` : '';
  const L = NET.lobby;
  if (L) {
    const kinds = {classic:'Klassisch', late:'Late Game', endless:'Endlos'};
    $('#nls').textContent = [kinds[L.mk] || 'Klassisch', L.mk === 'endless' ? 'ohne Rundenlimit' : `${clamp(+L.rounds || 7, 1, 50)} Runden`, L.mp ? 'mit Powerups' : 'ohne Powerups', `${clamp(+L.on || 0, 0, 99)} von ${clamp(+L.all || 0, 0, 99)} Spielen`].join(' · ');
  }
}
const netSendProf = () => netSend({t:'prof', name: P[1].name, av: AV[1]});

/* ---------- Gast: Raum beitreten ---------- */
function netJoin(code){
  NET.role = 'guest'; NET.code = code;
  NET.tok = NET.tok || netCode() + netCode();
  netOvState('connecting');
  netLoad().then(() => {
    const p = netNewPeer();
    p.on('open', () => {
      if (NET.peer !== p) return;
      if (NET.on) { if (!NET.open) netRetry(); return; }
      const c = p.connect(NET_PREFIX + code, {reliable: true, serialization: 'raw'});
      netBind(c);
      clearTimeout(NET.joinT);
      NET.joinT = setTimeout(() => { if (!NET.on && NET.role === 'guest') { netOvMsg('Keine Antwort vom Raum. Ist der Link richtig und die Seite beim anderen noch offen?'); netOvState('join'); netStop(); } }, 15000);
    });
  }, () => netNoLib());
}
// Verbindungsversuch abbrechen, ohne eine laufende Partie zu berühren
function netStop(){
  clearTimeout(NET.joinT); clearTimeout(NET.retryT);
  const c = NET.conn, p = NET.peer;
  NET.conn = null; NET.peer = null; NET.open = false;
  try { c && c.close(); } catch(e) {}
  try { p && p.destroy(); } catch(e) {}
}
function netEnd(msg){
  const was = NET.role, wasOn = NET.on;
  [NET.tickT, NET.watchT].forEach(clearInterval); [NET.retryT, NET.lostT, NET.joinT].forEach(clearTimeout);
  try { if (NET.conn && NET.open) NET.conn.send(JSON.stringify({t:'bye'})); } catch(e) {}
  const c = NET.conn, p = NET.peer;
  setTimeout(() => { try { c && c.close(); } catch(e) {} try { p && p.destroy(); } catch(e) {} }, 300);
  if (NET.mo) { NET.mo.disconnect(); NET.mo = null; }
  if (NET.graf) { cancelAnimationFrame(NET.graf); NET.graf = 0; }
  Object.assign(NET, {on: false, open: false, conn: null, peer: null, role: '', code: '', mirror: false, html: null, text: null, lastMain: null, lastG: '', lastL: '', pbLast: ['',''], sp: null, ping: 0, rtts: [], hostPing: 0, lobby: null,
    off: 0, offOk: false, offS: [], offT: 0, dispH: 0, dispG: 0, mutT: 0, flushQ: false, hold: 150, lags: [], vt: null, lrP: [], lrY: 0, za: '', zaG: 0});
  netSeqRun();   // was noch in der Warteschlange steckt, gilt jetzt sofort
  document.body.classList.remove('net', 'net-host', 'net-guest');
  netBanner('');
  const ov = $('#netov'); if (ov) ov.remove();
  const sv = NET.saved; NET.saved = null;
  if (was === 'host' && wasOn && sv) {
    P[1].name = sv.n; AV[1] = sv.av;
    // Ein offenes Eingabefeld des Gasts wird wieder normal bedienbar
    main.querySelectorAll('input[data-net="in"]').forEach(x => { x.readOnly = false; x.placeholder = ''; delete x.dataset.net; });
    main.querySelectorAll('[data-net="ok"]').forEach(b => { b.style.display = ''; delete b.dataset.net; });
    if (sv.bot) setBot(true, BOT.lvl);
    drawFigures(); updateHud();
    if (mode === 'menu') menu();
  }
  if (was === 'guest' && wasOn && sv) {
    // Eigener Name und Avatar aus dem Online-Spiel bleiben
    const myN = P[1].name, myA = AV[1];
    gen++; cur = null; G.active = false; pads(false); PBS = null;
    P[0].name = myN !== 'Spieler 2' ? myN : sv.n[0]; P[1].name = sv.n[1]; P.forEach(x => { x.score = 0; });
    AV = [avFix(myA, 0), sv.av[1]];
    MODE.kind = sv.mk; MODE.pu = sv.mp; rounds = sv.rounds;
    if (sv.bot) setBot(true, BOT.lvl);
    document.body.classList.remove('match', 'single', 'pu', 'pads', 'pbinl');
    drawFigures(); saveSettings(); menu();
  }
  netBadge();
  if (msg) toast(msg);
}
function netNoLib(){
  netOvMsg(NET_SITE ? `Online-Spielen geht nur auf der Webseite: <a href="${NET_SITE}" target="_blank" rel="noopener">${NET_SITE}</a>` : 'Online-Spielen geht nur auf der Webseite des Spiels.', true);
  netOvState('idle');
}

/* ---------- Fenster „Online spielen“ ---------- */
function netOpen(code){
  if ($('#netov')) return;
  const el = document.createElement('div'); el.className = 'help'; el.id = 'netov';
  el.innerHTML = `<div class="card cut netcard"><h2>🌐 Online spielen</h2><div id="nbody"></div><p class="hint nmsg" id="nmsg"></p></div>`;
  document.body.appendChild(el);
  el.addEventListener('click', e => { if (e.target === el && !NET.peer) el.remove(); });
  NET.joinCode = code || '';
  netOvState(code ? 'join' : 'idle');
}
function netOvMsg(t, html){ const m = $('#nmsg'); if (!m) return; if (html) m.innerHTML = t; else m.textContent = t; }
function netOvState(s){
  const b = $('#nbody'); if (!b) return;
  NET.ovState = s;
  if (s === 'idle') {
    b.innerHTML = `<p>Einer erstellt einen Raum und schickt den Link, der andere öffnet ihn oder gibt den Code ein.</p>
      <button class="btn" id="nhost">Raum erstellen</button>
      <div class="njoin"><input id="ncode" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn ghost" id="njoin">Beitreten</button></div>
      <button class="link" id="nclose">Schließen</button>`;
    $('#nhost').onclick = () => { netOvMsg(''); netHost(); };
    const join = () => { const c = $('#ncode').value.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (!netCodeOk(c)) { netOvMsg('Der Code hat 4 Zeichen, zum Beispiel K7QF.'); return; } NET.joinCode = c; netOvState('join'); };
    $('#njoin').onclick = join;
    $('#ncode').addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
    $('#nclose').onclick = () => { netStop(); NET.role = ''; $('#netov').remove(); };
  } else if (s === 'wait-server' || s === 'connecting') {
    b.innerHTML = `<p>${s === 'connecting' ? `Verbinde mit Raum <b>${esc(NET.code)}</b> …` : 'Raum wird erstellt …'}</p><button class="link" id="ncancel">Abbrechen</button>`;
    $('#ncancel').onclick = () => { netStop(); NET.role = ''; netOvMsg(''); netOvState('idle'); };
  } else if (s === 'hosting') {
    const link = netLink(NET.code);
    b.innerHTML = `<p>Dein Raum:</p><div class="ncodebig">${esc(NET.code)}</div>
      <p>Schick deinem Gegner diesen Link:</p><div class="nlink" id="nlink">${esc(link)}</div>
      <div class="introbtns">${navigator.share ? '<button class="btn" id="nshare">Link teilen</button>' : ''}<button class="btn ${navigator.share ? 'ghost' : ''}" id="ncopy">Link kopieren</button></div>
      <p class="hint">Warte auf Mitspieler … Lass diese Seite offen.</p>
      <button class="link" id="ncancel">Abbrechen</button>`;
    const sh = $('#nshare'); if (sh) sh.onclick = () => navigator.share({title: 'Duell der Disziplinen', text: `Duell gegen ${P[0].name}? Raum ${NET.code}:`, url: link}).catch(() => {});
    $('#ncopy').onclick = () => { const done = () => { $('#ncopy').textContent = 'Kopiert ✓'; }; if (navigator.clipboard) navigator.clipboard.writeText(link).then(done, () => netSelect()); else netSelect(); };
    $('#ncancel').onclick = () => { netStop(); NET.role = ''; netOvMsg(''); netOvState('idle'); };
  } else if (s === 'join') {
    const c = NET.joinCode;
    b.innerHTML = `<p>Raum <b>${esc(c)}</b> beitreten</p>
      <div class="vs nlme"><input id="nname" maxlength="14" placeholder="Dein Name" value="${esc(P[0].name === 'Spieler 1' ? '' : P[0].name)}"></div>
      <button class="btn" id="ngo">Beitreten</button><br>
      <button class="link" id="nback">Zurück</button>`;
    const go = () => {
      const n = $('#nname').value.replace(/[\u0000-\u001f\u007f]/g, '').trim().slice(0, 14);
      if (n) { P[0].name = n; saveSettings(); updateHud(); }
      NET.myName = n || 'Spieler 2'; NET.myAv = {...AV[0]};
      netOvMsg(''); netJoin(c);
    };
    $('#ngo').onclick = go;
    $('#nname').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    $('#nback').onclick = () => { netStop(); NET.role = ''; netOvMsg(''); netOvState('idle'); };
  }
}
function netSelect(){ const n = $('#nlink'); if (!n) return; const r = document.createRange(); r.selectNodeContents(n); const s = getSelection(); s.removeAllRanges(); s.addRange(r); netOvMsg('Markiert, jetzt kopieren.'); }

/* ---------- Anzeige: Verbindungspunkt im Kopf und Warnzeile ---------- */
function netBadge(){
  const d = $('#netd'); if (!d) return;
  if (!NET.on) { d.textContent = ''; d.className = 'netd'; d.title = ''; return; }
  const ping = NET.role === 'host' ? NET.ping : NET.hostPing;
  d.textContent = '🌐';
  d.className = 'netd ' + (!NET.open ? 'lost' : ping > 180 ? 'slow' : 'ok');
  d.title = NET.open ? `Online mit ${NET.role === 'host' ? P[1].name : P[0].name}${ping ? `, ${ping} ms` : ''}` : 'Verbindung unterbrochen';
  netLobbyInfo();
  const nb = $('#netbar'); if (nb) nb.innerHTML = netBarHTML();
}
const netBarHTML = () => `🌐 Online mit <b class="c2">${esc(P[1].name)}</b>${NET.open ? (NET.ping ? ` · ${NET.ping} ms` : '') : ' · unterbrochen'} <button class="link" id="netx">Trennen</button>`;
function netBanner(t){
  let el = $('#netw');
  if (!t) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'netw'; el.className = 'netw'; document.body.appendChild(el); }
  el.textContent = t;
}

/* ---------- Eingaben beim Gast: alles geht an den Gastgeber ---------- */
const netLocalUI = t => t.closest('#netov, #helpov, .vic, #avov, header.hud, .netlobby, #netw, .toast');
function netGuestPointer(e, kind){
  const t = e.target; if (!t || !t.closest || netLocalUI(t)) return;
  if (t.closest('#pad1')) { if (kind === 'pd') { e.preventDefault(); netGuestBuzz(); } return; }
  if (t.closest('#pad0')) { e.preventDefault(); return; }
  if (!NET.mirror || !t.closest('#main, #pb0, #pb1')) return;
  if (t.closest('input[data-net="in"]')) return;
  const ok = t.closest('[data-net="ok"]');
  e.preventDefault(); e.stopPropagation();
  if (ok) { if (kind === 'ck') netGuestSubmit(); return; }
  const el = t.closest('[data-m]');
  if (el) netIn({k: kind, m: +el.getAttribute('data-m')});
}
function netGuestBuzz(){
  const o = netIn({k:'buzz'});
  const p = $('#pad1'); p.classList.add('hit'); setTimeout(() => p.classList.remove('hit'), 90);
  // Neon-Sprint: der eigene Läufer springt sofort, der Gastgeber rechnet den Sprung auf diesen Moment zurück
  const S = NET.sp;
  if (S && curDisc && curDisc.id === 'sprint' && main.querySelector('#cv')) {
    NET.lrP.push(Number.isFinite(o.ct) ? o.ct : netTS(performance.now()));
    if (S.st && !S.ov && !S.fz && NET.lrY === 0) Snd.jump(1);
  }
}
addEventListener('pointerdown', e => { if (NET.on && NET.role === 'guest') netGuestPointer(e, 'pd'); }, true);
addEventListener('click', e => { if (NET.on && NET.role === 'guest') netGuestPointer(e, 'ck'); }, true);
function netGuestKey(e){
  const k = (e.key || '').toLowerCase();
  if (helpOpen && (k === 'escape' || k === 'enter')) { e.preventDefault(); closeHelp(); return; }
  if ($('#avov') || $('#netov')) return;
  if ($('.vic')) { if (cur && cur.key) cur.key(k); return; }
  if (e.target.tagName === 'INPUT') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (buzzOf(e) >= 0) { e.preventDefault(); netGuestBuzz(); return; }
  const r = rowOf(e);
  if (r) { e.preventDefault(); netIn({k:'row', i: r[1]}); return; }
  if (k === 'enter' || k === ' ') { e.preventDefault(); netIn({k:'key', n: k}); }
}
// Wer den Link mit Raum-Code öffnet, landet direkt beim Beitreten
function netFromLink(){
  const c = (location.hash || '').slice(1).toUpperCase();
  if (!netCodeOk(c)) return;
  history.replaceState(null, '', location.pathname + location.search);
  netOpen(c);
}


loadSettings();
$('#snd').textContent = Snd.on ? '🔊' : '🔇';
menu();
netFromLink();
